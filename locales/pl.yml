# GTK action labels use _ for a mnemonic; tooltip/accessibility text does not.
app:
  about: "_O programie Balun"
  quit: "_Zakończ"
  main_menu: "Menu główne"
  description: "Lekki, wieloplatformowy odtwarzacz telewizji na żywo z HDHomeRun"

navigation:
  devices: "Urządzenia"
  channels: "Kanały"
  live_tv: "Telewizja na żywo"
  channels_and_live_tv: "Kanały i telewizja na żywo"

controls:
  volume: "Głośność telewizji na żywo"
  mute: "Wycisz telewizję na żywo"
  unmute: "Włącz dźwięk telewizji na żywo"
  stop: "Zatrzymaj telewizję na żywo"
  enter_fullscreen: "Włącz pełny ekran"
  exit_fullscreen: "Wyłącz pełny ekran"
  video: "Obraz telewizji na żywo"
  status: "Stan odtwarzania telewizji na żywo"
  watching: "Oglądanie telewizji na żywo"

progress:
  stopped: "Zatrzymano"
  connecting: "Łączenie"
  playing: "Odtwarzanie"
  buffering: "Buforowanie"
  unavailable: "Niedostępne"
  playback_unavailable: "Odtwarzanie niedostępne"
  buffering_status: "Buforowanie %{percent}%"
  buffering_description: "Buforowanie telewizji na żywo: %{percent}%."
  opening: "Otwieranie %{channel} na %{device}."

startup:
  ready_title: "Wybierz kanał"
  ready_description: >-
    Odtwarzanie za pomocą GStreamer %{version} jest dostępne; wybierz kanał, aby uruchomić telewizję na żywo.
  missing_title: "Składniki odtwarzania są niedostępne"
  missing_description: "Brakuje wymaganych składników GStreamer: %{missing}."
  failed_title: "Inicjalizacja odtwarzania jest niedostępna"
  main_context_description: >-
    Inicjalizacja odtwarzania w Balun wymaga przejęcia domyślnego głównego kontekstu GLib. Wyszukiwanie urządzeń
    i przeglądanie listy kanałów pozostają dostępne.
  initialization_failed_description: >-
    Nie udało się zainicjalizować GStreamer. Wyszukiwanie urządzeń i przeglądanie listy kanałów pozostają
    dostępne.
  old_runtime_description: >-
    GStreamer %{found} jest zbyt stary; Balun wymaga GStreamer %{minimum} lub nowszego. Wyszukiwanie urządzeń i
    przeglądanie listy kanałów pozostają dostępne.
