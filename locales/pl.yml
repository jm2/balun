    Wyślij jedno ograniczone zapytanie wykrywania HDHomeRun na znany adres IP lub nazwę hosta; Balun nie
    skanuje zakresu adresów. Przykład: 192.168.1.20, fd00::20 lub tuner.example.
  target: "Adres IP lub nazwa hosta"
  cancel: "Anuluj"
  find: "Znajdź"
  enter_target: "Wpisz adres IP lub nazwę hosta urządzenia."
  hostname_characters: "Wpisz jedną nazwę hosta złożoną z liter, cyfr, łączników i kropek."
  hostname_syntax: "Wpisz nazwę hosta bez adresu URL, portu, ścieżki ani zakresu."
  unicast: "Wpisz użyteczny adres unicast urządzenia."
  numeric_address: "Wpisz jeden użyteczny liczbowy adres IPv4 lub IPv6."
  address_syntax: "Wpisz adres IP lub nazwę hosta bez adresu URL, portu ani zakresu."
  ipv4_direct: "Wpisz bezpośrednio adres IPv4."
  link_local: "Lokalny dla łącza IPv6 nie jest jeszcze obsługiwany; użyj IPv4 lub IPv6 bez identyfikatora strefy."
  scoped: "IPv6 z identyfikatorem strefy nie jest jeszcze obsługiwany; użyj IPv4 lub IPv6 bez identyfikatora strefy."
  forget_menu: "Zapomnij urządzenie…"
  forget_heading: "Zapomnieć to urządzenie?"
  forget_description: >-
    Balun przestanie odpytywać zapamiętany adres lub nazwę urządzenia „%{device}” przy uruchamianiu.
    Urządzenie pozostanie na liście do następnego uruchomienia.
  forget: "Zapomnij"
  forgotten: "Zapomniano urządzenie."
  forgotten_session: "Zapomniano urządzenie tylko na czas tej sesji; ustawienia są tylko do odczytu."
  remember_menu: "Zapamiętaj urządzenie"
  remembered: "Zapamiętano urządzenie."
  remembered_session: "Zapamiętano urządzenie tylko na czas tej sesji; ustawienia są tylko do odczytu."
  remember_unavailable: "Nie można zapamiętać adresu tego urządzenia."

subnet_search:
  button: "Przeszukaj podsieć"
  unavailable: "Wyszukiwanie w podsieci jest niedostępne, dopóki Balun nie obserwuje zmian sieci."
  title: "Przeszukaj podsieć"
  description: >-
    Wpisz jedną prywatną podsieć IPv4 od /23 do /32, na przykład 192.168.2.0/23. Potwierdzisz wyszukiwanie, zanim Balun
    cokolwiek wyśle.
  entry: "Prywatna podsieć"
  preview: "Adresy: %{candidates}. Żądania wychodzące: najwyżej %{requests}."
  invalid_syntax: "Wpisz jedną podsieć IPv4 w notacji CIDR, na przykład 192.168.2.0/24."
  noncanonical: "Wpisz adres sieci bez bitów hosta, na przykład 192.168.2.0/23."
  too_wide: "Wpisz podsieć od /23 do /32."
  not_private: "Wpisz podsieć z prywatnej przestrzeni adresów IPv4."
  cancel: "Anuluj"
  continue: "Dalej"
  forget: "Zapomnij podsieć"
  confirm_heading: "Przeszukać %{subnet}?"
  confirm_body: >-
    Wpisano %{subnet}. Adresy: %{candidates}. Budżet żądań wychodzących: najwyżej %{requests}, 64 na sekundę, przez
    maksymalnie 30 sekund. Ścieżkę wybiera bieżący routing sieciowy systemu. Budżet ogranicza to, co wysyła Balun, a nie
    to, co dostarczają routery.
  search: "Szukaj"
  searching: "Przeszukiwanie potwierdzonej podsieci w poszukiwaniu urządzeń HDHomeRun."
  busy: "Balun jest zajęty; spróbuj przeszukać podsieć ponownie za chwilę."
  confirmation_expired: "Sieć się zmieniła; ponownie sprawdź wyszukiwanie w podsieci."
  forgotten: "Zapomniano zapamiętaną podsieć."
  forgotten_session: "Zapomniano podsieć tylko na czas tej sesji; ustawienia są tylko do odczytu."
  stopped_title: "Wyszukiwanie w podsieci zatrzymane"
  stopped: "Żadne wyszukiwanie w podsieci nie jest uruchomione."
  searching_title: "Przeszukiwanie podsieci"
  searching_status: "Oczekiwanie na odpowiedzi z potwierdzonej podsieci; potrwa to do 30 sekund."
  complete_title: "Wyszukiwanie w podsieci zakończone"
  complete: "Sprawdzono każdy adres w potwierdzonej podsieci."
  none_title: "Nie znaleziono urządzeń HDHomeRun w podsieci"
  none: "Z potwierdzonej podsieci nie nadeszła żadna prawidłowa odpowiedź."
  incomplete_title: "Wyszukiwanie w podsieci niepełne"
  deadline: "Wyszukiwanie osiągnęło limit 30 sekund, zanim sprawdzono każdy adres."
  device_limit: "Wyszukiwanie zatrzymało się po znalezieniu 64 urządzeń, czyli limitu."
  unavailable_title: "Wyszukiwanie w podsieci niedostępne"
  unavailable_status: "Balun nie obserwuje zmian sieci, więc nie może teraz przeszukać podsieci."
  stale_title: "Nie rozpoczęto wyszukiwania w podsieci"
