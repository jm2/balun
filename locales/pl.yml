  watching: "Oglądanie telewizji na żywo"

progress:
  stopped: "Zatrzymano"
  connecting: "Łączenie"
  playing: "Odtwarzanie"
  buffering: "Buforowanie"
  unavailable: "Niedostępne"
  playback_unavailable: "Odtwarzanie niedostępne"
  buffering_status: "Buforowanie %{percent}%"
  buffering_description: "Buforowanie telewizji na żywo: %{percent}%."
  opening: "Otwieranie %{channel} na %{device}."

startup:
  ready_title: "Wybierz kanał"
  ready_description: >-
    Odtwarzanie za pomocą GStreamer %{version} jest dostępne; wybierz kanał, aby uruchomić telewizję na żywo.
  missing_title: "Składniki odtwarzania są niedostępne"
  missing_description: "Brakuje wymaganych składników GStreamer: %{missing}."
  failed_title: "Inicjalizacja odtwarzania jest niedostępna"
  main_context_description: >-
    Inicjalizacja odtwarzania w Balun wymaga przejęcia domyślnego głównego kontekstu GLib. Wyszukiwanie urządzeń
    i przeglądanie listy kanałów pozostają dostępne.
  initialization_failed_description: >-
    Nie udało się zainicjalizować GStreamer. Wyszukiwanie urządzeń i przeglądanie listy kanałów pozostają
    dostępne.
  old_runtime_description: >-
    GStreamer %{found} jest zbyt stary; Balun wymaga GStreamer %{minimum} lub nowszego. Wyszukiwanie urządzeń i
    przeglądanie listy kanałów pozostają dostępne.

device_dialogs:
  find_title: "Znajdź urządzenie według adresu"
  find_description: >-
    Wyślij jedno ograniczone zapytanie wykrywania HDHomeRun na znany adres IP lub nazwę hosta; Balun nie
    skanuje zakresu adresów. Przykład: 192.168.1.20, fd00::20 lub tuner.example.
  target: "Adres IP lub nazwa hosta"
  cancel: "Anuluj"
  find: "Znajdź"
  enter_target: "Wpisz adres IP lub nazwę hosta urządzenia."
  hostname_characters: "Wpisz jedną nazwę hosta złożoną z liter, cyfr, łączników i kropek."
  hostname_syntax: "Wpisz nazwę hosta bez adresu URL, portu, ścieżki ani zakresu."
  unicast: "Wpisz użyteczny adres unicast urządzenia."
  numeric_address: "Wpisz jeden użyteczny liczbowy adres IPv4 lub IPv6."
  address_syntax: "Wpisz adres IP lub nazwę hosta bez adresu URL, portu ani zakresu."
  ipv4_direct: "Wpisz bezpośrednio adres IPv4."
  link_local: "Lokalny dla łącza IPv6 nie jest jeszcze obsługiwany; użyj IPv4 lub IPv6 bez identyfikatora strefy."
  scoped: "IPv6 z identyfikatorem strefy nie jest jeszcze obsługiwany; użyj IPv4 lub IPv6 bez identyfikatora strefy."
  forget_menu: "Zapomnij urządzenie…"
  forget_heading: "Zapomnieć to urządzenie?"
  forget_description: >-
    Balun przestanie odpytywać zapamiętany adres lub nazwę urządzenia „%{device}” przy uruchamianiu.
    Urządzenie pozostanie na liście do następnego uruchomienia.
  forget: "Zapomnij"
  forgotten: "Zapomniano urządzenie."
  forgotten_session: "Zapomniano urządzenie tylko na czas tej sesji; ustawienia są tylko do odczytu."

failure:
  busy_title: "Brak dostępnego tunera"
  busy_description: >-
    Wszystkie tunery urządzenia %{device} są zajęte. Wyszukiwanie urządzeń i przeglądanie listy kanałów
    pozostają dostępne.
  channel_title: "Kanał niedostępny"
  channel_description: >-
    Urządzenie %{device} nie udostępnia już kanału %{channel}. Użyj opcji Wczytaj kanały ponownie, aby
    odświeżyć listę. Wyszukiwanie urządzeń i przeglądanie listy kanałów pozostają dostępne.
  rejected_title: "Urządzenie odrzuciło strumień"
  rejected_description: >-
    Urządzenie %{device} odrzuciło żądanie kanału %{channel}. Wyszukiwanie urządzeń i przeglądanie listy
    kanałów pozostają dostępne.
  offline_title: "Urządzenie lub strumień niedostępny"
  offline_description: >-
    Urządzenie %{device} nie przesłało kanału %{channel}. Sprawdź, czy urządzenie jest włączone i osiągalne.
    Wyszukiwanie urządzeń i przeglądanie listy kanałów pozostają dostępne.
  codec_title: "Wymagany składnik odtwarzania lub kodek niedostępny"
  missing_audio_description: >-
    Ta wersja Balun nie ma dekodera dźwięku %{codec} dla kanału %{channel} na urządzeniu %{device}.
    Wyszukiwanie urządzeń i przeglądanie listy kanałów pozostają dostępne.
  missing_video_description: >-
    Ta wersja Balun nie ma dekodera obrazu %{codec} dla kanału %{channel} na urządzeniu %{device}.
    Wyszukiwanie urządzeń i przeglądanie listy kanałów pozostają dostępne.
  missing_component_description: >-
    W tej wersji Balun brakuje kodeka lub wtyczki GStreamer wymaganej dla kanału %{channel} na urządzeniu
    %{device}. Wyszukiwanie urządzeń i przeglądanie listy kanałów pozostają dostępne.
  protected_title: "Kanał chroniony nie jest obsługiwany"
  protected_description: >-
    Kanał %{channel} na urządzeniu %{device} jest chroniony i nie można go odtworzyć. Wyszukiwanie urządzeń
    i przeglądanie listy kanałów pozostają dostępne.
  internal_title: "Odtwarzanie nie powiodło się"
  internal_description: >-
    Odtwarzanie kanału %{channel} na urządzeniu %{device} zatrzymało się z powodu błędu wewnętrznego.
    Wyszukiwanie urządzeń i przeglądanie listy kanałów pozostają dostępne.
  generic_title: "Nie można odtworzyć kanału"
  generic_description: >-
    Nie udało się uruchomić wybranego kanału. Wyszukiwanie urządzeń i przeglądanie listy kanałów pozostają
    dostępne.
  stop_title: "Nie można zatrzymać telewizji na żywo"
  stop_description: "Nie udało się prawidłowo zatrzymać odtwarzania. Zamknij Balun przed wybraniem innego kanału."
  selected_device: "wybrane urządzenie"
  selected_channel: "wybrany kanał"
  channel_number: "kanał %{number}"
