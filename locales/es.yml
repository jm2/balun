# GTK action labels use _ for a mnemonic; tooltip/accessibility text does not.
app:
  about: "_Acerca de Balun"
  quit: "_Salir"
  main_menu: "Menú principal"
  description: "Un reproductor ligero y multiplataforma de televisión en directo para HDHomeRun"

navigation:
  devices: "Dispositivos"
  channels: "Canales"
  live_tv: "TV en directo"
  channels_and_live_tv: "Canales y TV en directo"

controls:
  volume: "Volumen de TV en directo"
  mute: "Silenciar TV en directo"
  unmute: "Activar el sonido de TV en directo"
  stop: "Detener TV en directo"
  enter_fullscreen: "Entrar en pantalla completa"
  exit_fullscreen: "Salir de pantalla completa"
  video: "Vídeo de TV en directo"
  status: "Estado de reproducción de TV en directo"
  watching: "Viendo TV en directo"

progress:
  stopped: "Detenido"
  connecting: "Conectando"
  playing: "Reproduciendo"
  buffering: "Almacenando en búfer"
  unavailable: "No disponible"
  playback_unavailable: "Reproducción no disponible"
  buffering_status: "Almacenando en búfer: %{percent} %"
  buffering_description: "La TV en directo se está almacenando en búfer: %{percent} %."
  opening: "Abriendo %{channel} en %{device}."

startup:
  ready_title: "Selecciona un canal"
  ready_description: >-
    La reproducción con GStreamer %{version} está disponible; activa un canal para iniciar la TV en directo.
  missing_title: "Componentes de reproducción no disponibles"
  missing_description: "Faltan componentes necesarios de GStreamer: %{missing}."
  failed_title: "Inicialización de reproducción no disponible"
  main_context_description: >-
    La inicialización de reproducción de Balun requiere el control del contexto principal predeterminado de
    GLib. La búsqueda de dispositivos y la consulta de canales siguen disponibles.
  initialization_failed_description: >-
    No se pudo inicializar GStreamer. La búsqueda de dispositivos y la consulta de canales siguen disponibles.
  old_runtime_description: >-
    GStreamer %{found} es demasiado antiguo; Balun requiere GStreamer %{minimum} o posterior. La búsqueda de
    dispositivos y la consulta de canales siguen disponibles.
