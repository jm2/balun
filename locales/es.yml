    GStreamer %{found} es demasiado antiguo; Balun requiere GStreamer %{minimum} o posterior. La búsqueda de
    dispositivos y la consulta de canales siguen disponibles.

device_dialogs:
  find_title: "Buscar dispositivo por dirección"
  find_description: >-
    Enviar una solicitud limitada de detección HDHomeRun a una dirección IP o nombre de host conocido; Balun
    no explora un rango de direcciones. Ejemplo: 192.168.1.20, fd00::20 o tuner.example.
  target: "Dirección IP o nombre de host"
  cancel: "Cancelar"
  find: "Buscar"
  enter_target: "Introduce la dirección IP o el nombre de host de un dispositivo."
  hostname_characters: "Introduce un nombre de host con letras, dígitos, guiones y puntos."
  hostname_syntax: "Introduce un nombre de host sin URL, puerto, ruta ni rango."
  unicast: "Introduce una dirección unicast válida para el dispositivo."
  numeric_address: "Introduce una dirección numérica IPv4 o IPv6 válida."
  address_syntax: "Introduce una dirección IP o nombre de host sin URL, puerto ni rango."
  ipv4_direct: "Introduce la dirección IPv4 directamente."
  link_local: "IPv6 de enlace local aún no es compatible; usa IPv4 o IPv6 sin identificador de zona."
  scoped: "IPv6 con identificador de zona aún no es compatible; usa IPv4 o IPv6 sin identificador de zona."
  forget_menu: "Olvidar dispositivo…"
  forget_heading: "¿Olvidar este dispositivo?"
  forget_description: >-
    Balun dejará de consultar la dirección o el nombre guardado de «%{device}» al iniciarse. El dispositivo
    seguirá en la lista hasta el próximo inicio.
  forget: "Olvidar"
  forgotten: "Dispositivo olvidado."
  forgotten_session: "Dispositivo olvidado solo durante esta sesión; los ajustes son de solo lectura."
  remember_menu: "Recordar dispositivo"
  remembered: "Dispositivo recordado."
  remembered_session: "Dispositivo recordado solo durante esta sesión; los ajustes son de solo lectura."
  remember_unavailable: "No se puede recordar la dirección de este dispositivo."

subnet_search:
  button: "Buscar en una subred"
  unavailable: "La búsqueda en subred no está disponible hasta que Balun vigile los cambios de red."
  title: "Buscar en una subred"
  description: >-
    Introduce una subred IPv4 privada de /23 a /32, por ejemplo 192.168.2.0/23. Confirmarás la búsqueda antes de que
    Balun envíe nada.
  entry: "Subred privada"
  preview: "Direcciones: %{candidates}. Solicitudes salientes: como máximo %{requests}."
  invalid_syntax: "Introduce una subred IPv4 en formato CIDR, por ejemplo 192.168.2.0/24."
  noncanonical: "Introduce la dirección de red sin bits de host, por ejemplo 192.168.2.0/23."
  too_wide: "Introduce una subred de /23 a /32."
  not_private: "Introduce una subred dentro del espacio de direcciones IPv4 privadas."
  cancel: "Cancelar"
  continue: "Continuar"
  forget: "Olvidar subred"
  confirm_heading: "¿Buscar en %{subnet}?"
  confirm_body: >-
    Has introducido %{subnet}. Direcciones: %{candidates}. Presupuesto de solicitudes salientes: como máximo %{requests}
    solicitudes, 64 por segundo, durante un máximo de 30 segundos. El enrutamiento de red actual de tu sistema elige la
    ruta. El presupuesto limita lo que envía Balun, no lo que entregan los routers.
  search: "Buscar"
  searching: "Buscando dispositivos HDHomeRun en la subred confirmada."
  busy: "Balun está ocupado; vuelve a intentar la búsqueda en subred en un momento."
  confirmation_expired: "La red ha cambiado; revisa de nuevo la búsqueda en subred."
  forgotten: "Subred guardada olvidada."
  forgotten_session: "Subred olvidada solo durante esta sesión; los ajustes son de solo lectura."
  stopped_title: "Búsqueda en subred detenida"
  stopped: "No hay ninguna búsqueda en subred en curso."
  searching_title: "Buscando en la subred"
  searching_status: "Esperando respuestas de la subred confirmada; esto tarda hasta 30 segundos."
  complete_title: "Búsqueda en subred completada"
  complete: "Se ha sondeado cada dirección de la subred confirmada."
  none_title: "No se encontraron dispositivos HDHomeRun en la subred"
  none: "No llegó ninguna respuesta válida de la subred confirmada."
  incomplete_title: "Búsqueda en subred incompleta"
  deadline: "La búsqueda alcanzó su límite de 30 segundos antes de sondear todas las direcciones."
  device_limit: "La búsqueda se detuvo tras encontrar 64 dispositivos, su límite."
  unavailable_title: "Búsqueda en subred no disponible"
  unavailable_status: "Balun no está vigilando los cambios de red, así que ahora no puede buscar en una subred."
  stale_title: "Búsqueda en subred no iniciada"
  stale: "La red cambió después de que confirmaras la búsqueda. Vuelve a confirmarla."
  changed: >-
    La red cambió durante la búsqueda, así que se descartaron sus respuestas. Busca de nuevo para confirmar la subred en
    esta red.
  failed_title: "La búsqueda en subred falló"
  failed: "No se pudo completar la búsqueda en subred."
  banner_complete: "Búsqueda en subred completada."
  banner_none: "No llegaron respuestas HDHomeRun de la subred."
  banner_deadline: "Búsqueda en subred incompleta: se alcanzó el límite de tiempo."
  banner_device_limit: "Búsqueda en subred incompleta: se alcanzó el límite de dispositivos."
  banner_changed: "La red cambió; la búsqueda en subred se detuvo."
  banner_stale: "La red cambió; confirma de nuevo la búsqueda en subred."
  banner_unavailable: "La búsqueda en subred no está disponible ahora mismo."
  banner_failed: "La búsqueda en subred falló."

failure:
  busy_title: "No hay sintonizadores disponibles"
  busy_description: >-
    Todos los sintonizadores de %{device} están ocupados. La búsqueda de dispositivos y la consulta de
    canales siguen disponibles.
  channel_title: "Canal no disponible"
  channel_description: >-
    %{device} ya no ofrece %{channel}. Use Recargar canales para volver a leer su lista. La búsqueda de
    dispositivos y la consulta de canales siguen disponibles.
  rejected_title: "El dispositivo rechazó la transmisión"
  rejected_description: >-
    %{device} rechazó la solicitud de %{channel}. La búsqueda de dispositivos y la consulta de canales
    siguen disponibles.
  offline_title: "Dispositivo o transmisión no disponible"
  offline_description: >-
    %{device} no transmitió %{channel}. Compruebe que el dispositivo esté encendido y sea accesible. La
    búsqueda de dispositivos y la consulta de canales siguen disponibles.
  codec_title: "Componente de reproducción o códec necesario no disponible"
  missing_audio_description: >-
    Esta versión de Balun no tiene un decodificador de audio %{codec} para %{channel} en %{device}. La
    búsqueda de dispositivos y la consulta de canales siguen disponibles.
  missing_video_description: >-
    Esta versión de Balun no tiene un decodificador de vídeo %{codec} para %{channel} en %{device}. La
    búsqueda de dispositivos y la consulta de canales siguen disponibles.
  missing_component_description: >-
    Esta versión de Balun carece de un códec o complemento de GStreamer necesario para %{channel} en
    %{device}. La búsqueda de dispositivos y la consulta de canales siguen disponibles.
  protected_title: "Canal protegido no compatible"
  protected_description: >-
    %{channel} en %{device} está protegido y no se puede reproducir. La búsqueda de dispositivos y la
    consulta de canales siguen disponibles.
  internal_title: "Error de reproducción"
  internal_description: >-
    La reproducción de %{channel} en %{device} se detuvo debido a un error interno. La búsqueda de
    dispositivos y la consulta de canales siguen disponibles.
  generic_title: "No se puede reproducir el canal"
  generic_description: >-
    No se pudo iniciar el canal seleccionado. La búsqueda de dispositivos y la consulta de canales siguen
    disponibles.
  stop_title: "No se puede detener la televisión en directo"
  stop_description: "La reproducción no se pudo detener correctamente. Cierre Balun antes de seleccionar otro canal."
  selected_device: "el dispositivo seleccionado"
  selected_channel: "el canal seleccionado"
  channel_number: "canal %{number}"

settings:
  unavailable: "No se pueden guardar los ajustes; los cambios solo se aplican a esta sesión."
