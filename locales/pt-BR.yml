  enter_fullscreen: "Entrar em tela cheia"
  exit_fullscreen: "Sair da tela cheia"
  video: "Vídeo da TV ao vivo"
  status: "Estado de reprodução da TV ao vivo"
  watching: "Assistindo TV ao vivo"

progress:
  stopped: "Parado"
