  buffering_description: "Буферизация прямого эфира: %{percent}%."
  opening: "Открытие %{channel} на %{device}."

startup:
  ready_title: "Выберите канал"
  ready_description: >-
    Воспроизведение через GStreamer %{version} доступно. Выберите канал, чтобы начать просмотр прямого эфира.
  missing_title: "Компоненты воспроизведения недоступны"
  missing_description: "Отсутствуют необходимые компоненты GStreamer: %{missing}."
  failed_title: "Инициализация воспроизведения недоступна"
  main_context_description: >-
    Для инициализации воспроизведения Balun необходимо владеть основным контекстом GLib по умолчанию. Поиск
    устройств и просмотр списка каналов остаются доступными.
  initialization_failed_description: >-
    Не удалось инициализировать GStreamer. Поиск устройств и просмотр списка каналов остаются доступными.
  old_runtime_description: >-
    Версия GStreamer %{found} слишком старая. Balun требуется GStreamer %{minimum} или новее. Поиск устройств и
    просмотр списка каналов остаются доступными.

device_dialogs:
  find_title: "Найти устройство по адресу"
  find_description: >-
    Отправить один ограниченный запрос обнаружения HDHomeRun на известный IP-адрес или имя хоста; Balun не
    сканирует диапазон адресов. Пример: 192.168.1.20, fd00::20 или tuner.example.
  target: "IP-адрес или имя хоста"
  cancel: "Отмена"
  find: "Найти"
  enter_target: "Введите IP-адрес или имя хоста устройства."
  hostname_characters: "Введите одно имя хоста из букв, цифр, дефисов и точек."
  hostname_syntax: "Введите имя хоста без URL, порта, пути или диапазона."
  unicast: "Введите допустимый одноадресный адрес устройства."
  numeric_address: "Введите один допустимый числовой адрес IPv4 или IPv6."
  address_syntax: "Введите IP-адрес или имя хоста без URL, порта или диапазона."
  ipv4_direct: "Введите адрес IPv4 напрямую."
  link_local: >-
    Локальные адреса IPv6 канального уровня пока не поддерживаются; используйте IPv4 или IPv6 без
    идентификатора зоны.
  scoped: "IPv6 с идентификатором зоны пока не поддерживается; используйте IPv4 или IPv6 без идентификатора зоны."
  forget_menu: "Забыть устройство…"
  forget_heading: "Забыть это устройство?"
  forget_description: >-
    Balun перестанет опрашивать сохранённый адрес или имя «%{device}» при запуске. Устройство останется в
    списке до следующего запуска.
  forget: "Забыть"
  forgotten: "Устройство забыто."
  forgotten_session: "Устройство забыто только на время этого сеанса; настройки доступны только для чтения."
