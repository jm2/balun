startup:
  ready_title: "Выберите канал"
  ready_description: >-
    Воспроизведение через GStreamer %{version} доступно. Выберите канал, чтобы начать просмотр прямого эфира.
  missing_title: "Компоненты воспроизведения недоступны"
  missing_description: "Отсутствуют необходимые компоненты GStreamer: %{missing}."
  failed_title: "Инициализация воспроизведения недоступна"
  main_context_description: >-
    Для инициализации воспроизведения Balun необходимо владеть основным контекстом GLib по умолчанию. Поиск
    устройств и просмотр списка каналов остаются доступными.
  initialization_failed_description: >-
    Не удалось инициализировать GStreamer. Поиск устройств и просмотр списка каналов остаются доступными.
  old_runtime_description: >-
    Версия GStreamer %{found} слишком старая. Balun требуется GStreamer %{minimum} или новее. Поиск устройств и
    просмотр списка каналов остаются доступными.

device_dialogs:
  find_title: "Найти устройство по адресу"
  find_description: >-
    Отправить один ограниченный запрос обнаружения HDHomeRun на известный IP-адрес или имя хоста; Balun не
    сканирует диапазон адресов. Пример: 192.168.1.20, fd00::20 или tuner.example.
  target: "IP-адрес или имя хоста"
  cancel: "Отмена"
  find: "Найти"
  enter_target: "Введите IP-адрес или имя хоста устройства."
  hostname_characters: "Введите одно имя хоста из букв, цифр, дефисов и точек."
  hostname_syntax: "Введите имя хоста без URL, порта, пути или диапазона."
  unicast: "Введите допустимый одноадресный адрес устройства."
  numeric_address: "Введите один допустимый числовой адрес IPv4 или IPv6."
  address_syntax: "Введите IP-адрес или имя хоста без URL, порта или диапазона."
  ipv4_direct: "Введите адрес IPv4 напрямую."
  link_local: >-
    Локальные адреса IPv6 канального уровня пока не поддерживаются; используйте IPv4 или IPv6 без
    идентификатора зоны.
  scoped: "IPv6 с идентификатором зоны пока не поддерживается; используйте IPv4 или IPv6 без идентификатора зоны."
  forget_menu: "Забыть устройство…"
  forget_heading: "Забыть это устройство?"
  forget_description: >-
    Balun перестанет опрашивать сохранённый адрес или имя «%{device}» при запуске. Устройство останется в
    списке до следующего запуска.
  forget: "Забыть"
  forgotten: "Устройство забыто."
  forgotten_session: "Устройство забыто только на время этого сеанса; настройки доступны только для чтения."

subnet_search:
  button: "Поиск в подсети"
  unavailable: "Поиск в подсети недоступен, пока Balun не отслеживает изменения сети."
  title: "Поиск в подсети"
  description: >-
    Введите одну частную подсеть IPv4 от /23 до /32, например 192.168.2.0/23. Вы подтвердите поиск до того, как Balun
    что-либо отправит.
  entry: "Частная подсеть"
  preview: "Адресов: %{candidates}. Исходящих запросов: не более %{requests}."
  invalid_syntax: "Введите одну подсеть IPv4 в формате CIDR, например 192.168.2.0/24."
  noncanonical: "Введите адрес сети без битов узла, например 192.168.2.0/23."
  too_wide: "Введите подсеть от /23 до /32."
  not_private: "Введите подсеть из частного адресного пространства IPv4."
  cancel: "Отмена"
  continue: "Продолжить"
  forget: "Забыть подсеть"
  confirm_heading: "Искать в %{subnet}?"
  confirm_body: >-
    Вы ввели %{subnet}. Адресов: %{candidates}. Бюджет исходящих запросов: не более %{requests}, 64 в секунду, не дольше
    30 секунд. Путь выбирает текущая сетевая маршрутизация вашей системы. Бюджет ограничивает то, что отправляет Balun,
    а не то, что доставляют маршрутизаторы.
  search: "Искать"
  searching: "Поиск устройств HDHomeRun в подтверждённой подсети."
  busy: "Balun занят; повторите поиск в подсети через минуту."
  confirmation_expired: "Сеть изменилась; проверьте поиск в подсети ещё раз."
  forgotten: "Сохранённая подсеть забыта."
  forgotten_session: "Подсеть забыта только на время этого сеанса; настройки доступны только для чтения."
  stopped_title: "Поиск в подсети остановлен"
  stopped: "Поиск в подсети не выполняется."
  searching_title: "Поиск в подсети"
  searching_status: "Ожидание ответов из подтверждённой подсети; это занимает до 30 секунд."
  complete_title: "Поиск в подсети завершён"
  complete: "Опрошен каждый адрес подтверждённой подсети."
  none_title: "В подсети не найдено устройств HDHomeRun"
  none: "Из подтверждённой подсети не пришло ни одного корректного ответа."
  incomplete_title: "Поиск в подсети не завершён"
  deadline: "Поиск достиг ограничения в 30 секунд, прежде чем были опрошены все адреса."
  device_limit: "Поиск остановлен после обнаружения 64 устройств — это предел."
  unavailable_title: "Поиск в подсети недоступен"
  unavailable_status: "Balun не отслеживает изменения сети, поэтому сейчас не может искать в подсети."
  stale_title: "Поиск в подсети не запущен"
  stale: "Сеть изменилась после подтверждения поиска. Подтвердите его снова."
  changed: >-
    Сеть изменилась во время поиска, поэтому его ответы отброшены. Повторите поиск, чтобы подтвердить подсеть для этой
    сети.
  failed_title: "Сбой поиска в подсети"
  failed: "Не удалось завершить поиск в подсети."
  banner_complete: "Поиск в подсети завершён."
  banner_none: "Из подсети не пришло ответов HDHomeRun."
  banner_deadline: "Поиск в подсети не завершён: достигнуто ограничение по времени."
  banner_device_limit: "Поиск в подсети не завершён: достигнут предел устройств."
  banner_changed: "Сеть изменилась; поиск в подсети остановлен."
  banner_stale: "Сеть изменилась; подтвердите поиск в подсети снова."
  banner_unavailable: "Поиск в подсети сейчас недоступен."
  banner_failed: "Сбой поиска в подсети."

failure:
  busy_title: "Нет доступных тюнеров"
  busy_description: >-
    Все тюнеры устройства %{device} заняты. Поиск устройств и просмотр списка каналов по-прежнему доступны.
  channel_title: "Канал недоступен"
  channel_description: >-
    Устройство %{device} больше не предоставляет %{channel}. Используйте «Перезагрузить каналы», чтобы
    обновить список. Поиск устройств и просмотр списка каналов по-прежнему доступны.
  rejected_title: "Устройство отклонило поток"
  rejected_description: >-
    Устройство %{device} отклонило запрос канала %{channel}. Поиск устройств и просмотр списка каналов
    по-прежнему доступны.
  offline_title: "Устройство или поток недоступны"
  offline_description: >-
    Устройство %{device} не передало %{channel}. Проверьте, что устройство включено и доступно. Поиск
    устройств и просмотр списка каналов по-прежнему доступны.
  codec_title: "Необходимый компонент воспроизведения или кодек недоступен"
  missing_audio_description: >-
    В этой сборке Balun нет аудиодекодера %{codec} для канала %{channel} на устройстве %{device}. Поиск
    устройств и просмотр списка каналов по-прежнему доступны.
  missing_video_description: >-
    В этой сборке Balun нет видеодекодера %{codec} для канала %{channel} на устройстве %{device}. Поиск
    устройств и просмотр списка каналов по-прежнему доступны.
  missing_component_description: >-
    В этой сборке Balun отсутствует кодек или плагин GStreamer для канала %{channel} на устройстве
    %{device}. Поиск устройств и просмотр списка каналов по-прежнему доступны.
  protected_title: "Защищённый канал не поддерживается"
  protected_description: >-
    Канал %{channel} на устройстве %{device} защищён и не может быть воспроизведён. Поиск устройств и
    просмотр списка каналов по-прежнему доступны.
  internal_title: "Ошибка воспроизведения"
  internal_description: >-
    Воспроизведение канала %{channel} на устройстве %{device} остановлено из-за внутренней ошибки. Поиск
    устройств и просмотр списка каналов по-прежнему доступны.
  generic_title: "Не удалось воспроизвести канал"
  generic_description: >-
    Не удалось запустить выбранный канал. Поиск устройств и просмотр списка каналов по-прежнему доступны.
  stop_title: "Не удалось остановить прямой эфир"
  stop_description: "Не удалось корректно остановить воспроизведение. Закройте Balun перед выбором другого канала."
  selected_device: "выбранное устройство"
  selected_channel: "выбранный канал"
  channel_number: "канал %{number}"

settings:
  unavailable: "Не удаётся сохранить настройки; изменения действуют только в этом сеансе."
