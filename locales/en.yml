# GTK action labels use _ for a mnemonic; tooltip/accessibility text does not.
app:
  about: "_About Balun"
  quit: "_Quit"
  main_menu: "Main menu"
  description: "A lightweight cross-platform HDHomeRun live TV viewer"

navigation:
  devices: "Devices"
  channels: "Channels"
  live_tv: "Live TV"
  channels_and_live_tv: "Channels and live TV"

controls:
  volume: "Live TV volume"
  mute: "Mute live TV"
  unmute: "Unmute live TV"
  stop: "Stop live TV"
  enter_fullscreen: "Enter fullscreen"
  exit_fullscreen: "Exit fullscreen"
  video: "Live TV video"
  status: "Live TV playback status"
  watching: "Watching live TV"

progress:
  stopped: "Stopped"
  connecting: "Connecting"
  playing: "Playing"
  buffering: "Buffering"
  unavailable: "Unavailable"
  playback_unavailable: "Playback unavailable"
  buffering_status: "Buffering %{percent}%"
  buffering_description: "Live TV is buffering: %{percent}%."
  opening: "Opening %{channel} on %{device}."

startup:
  ready_title: "Select a channel"
  ready_description: "The GStreamer %{version} playback foundation is available; activate a channel to start live TV."
  missing_title: "Playback components unavailable"
  missing_description: "Required GStreamer factories are missing: %{missing}."
  failed_title: "Playback initialization unavailable"
  main_context_description: >-
    Balun playback initialization requires ownership of the default GLib main context. Device discovery and
    lineup inspection remain available.
  initialization_failed_description: >-
    GStreamer could not be initialized. Device discovery and lineup inspection remain available.
  old_runtime_description: >-
    GStreamer %{found} is too old; Balun requires GStreamer %{minimum} or newer. Device discovery and lineup
    inspection remain available.

device_dialogs:
  find_title: "Find device by address"
  find_description: >-
    Send one bounded HDHomeRun discovery request to a known IP address or hostname; Balun does not scan a
    range. Example: 192.168.1.20, fd00::20, or tuner.example.
  target: "IP address or hostname"
  cancel: "Cancel"
  find: "Find"
  enter_target: "Enter a device IP address or hostname."
  hostname_characters: "Enter one hostname of letters, digits, hyphens, and dots."
  hostname_syntax: "Enter a hostname without a URL, port, path, or range."
  unicast: "Enter a usable unicast device address."
  numeric_address: "Enter one usable numeric IPv4 or IPv6 address."
  address_syntax: "Enter an IP address or hostname without a URL, port, or range."
  ipv4_direct: "Enter the IPv4 address directly."
  link_local: "Link-local IPv6 is not supported yet; use IPv4 or unscoped IPv6."
  scoped: "Scoped IPv6 is not supported yet; use IPv4 or unscoped IPv6."
  forget_menu: "Forget device…"
  forget_heading: "Forget this device?"
  forget_description: >-
    Balun will stop probing the remembered address or name for “%{device}” at launch. The device stays listed
    until the next launch.
  forget: "Forget"
  forgotten: "Device forgotten."
  forgotten_session: "Device forgotten for this session only; settings are read-only."

subnet_search:
  button: "Search a subnet"
  unavailable: "Subnet search is unavailable until Balun is watching for network changes."
  title: "Search a subnet"
  description: >-
    Enter one private IPv4 subnet from /23 to /32, such as 192.168.2.0/23. You confirm the search before Balun
    sends anything.
  entry: "Private subnet"
  preview: "Addresses: %{candidates}. Outbound requests: at most %{requests}."
  invalid_syntax: "Enter one IPv4 subnet in CIDR form, such as 192.168.2.0/24."
  noncanonical: "Enter the network address without host bits, such as 192.168.2.0/23."
  too_wide: "Enter a subnet from /23 through /32."
  not_private: "Enter a subnet inside private IPv4 address space."
  cancel: "Cancel"
  continue: "Continue"
  forget: "Forget subnet"
  confirm_heading: "Search %{subnet}?"
  confirm_body: >-
    You entered %{subnet}. Addresses: %{candidates}. Outbound request budget: at most %{requests} requests, 64
    per second, for up to 30 seconds. Your system's current network routing selects the path. The budget limits
    what Balun sends, not what routers deliver.
  search: "Search"
  searching: "Searching the confirmed subnet for HDHomeRun devices."
  busy: "Balun is busy; try the subnet search again in a moment."
  confirmation_expired: "The network changed; review the subnet search again."
  forgotten: "Remembered subnet forgotten."
  forgotten_session: "Subnet forgotten for this session only; settings are read-only."
  stopped_title: "Subnet search stopped"
  stopped: "No subnet search is running."
  searching_title: "Searching the subnet"
  searching_status: "Waiting for replies from the confirmed subnet; this takes up to 30 seconds."
  complete_title: "Subnet search complete"
  complete: "Every address in the confirmed subnet was probed."
  none_title: "No HDHomeRun devices found in the subnet"
  none: "No valid reply came from the confirmed subnet."
  incomplete_title: "Subnet search incomplete"
  deadline: "The search reached its 30-second limit before every address was probed."
  device_limit: "The search stopped after finding 64 devices, its limit."
  unavailable_title: "Subnet search unavailable"
  unavailable_status: "Balun is not watching for network changes, so it cannot search a subnet now."
  stale_title: "Subnet search not started"
  stale: "The network changed after you confirmed the search. Confirm it again."
  changed: >-
    The network changed during the search, so its replies were discarded. Search again to confirm the subnet for
    this network.
  failed_title: "Subnet search failed"
  failed: "The subnet search could not be completed."
  banner_complete: "Subnet search complete."
  banner_none: "No HDHomeRun replies came from the subnet."
  banner_deadline: "Subnet search incomplete: time limit reached."
  banner_device_limit: "Subnet search incomplete: device limit reached."
  banner_changed: "Network changed; the subnet search stopped."
  banner_stale: "Network changed; confirm the subnet search again."
  banner_unavailable: "Subnet search is unavailable right now."
  banner_failed: "Subnet search failed."

failure:
  busy_title: "No tuner available"
  busy_description: "All tuners on %{device} are busy. Device discovery and lineup inspection remain available."
  channel_title: "Channel unavailable"
  channel_description: >-
    %{device} no longer offers %{channel}. Use Reload channels to read its lineup again. Device discovery
    and lineup inspection remain available.
  rejected_title: "Device rejected the stream"
  rejected_description: >-
    %{device} rejected the request for %{channel}. Device discovery and lineup inspection remain available.
  offline_title: "Device or stream unavailable"
  offline_description: >-
    %{device} did not deliver %{channel}. Check that the device is powered and reachable. Device discovery
    and lineup inspection remain available.
  codec_title: "Required playback component or codec unavailable"
  missing_audio_description: >-
    This Balun build has no %{codec} audio decoder for %{channel} on %{device}. Device discovery and lineup
    inspection remain available.
  missing_video_description: >-
    This Balun build has no %{codec} video decoder for %{channel} on %{device}. Device discovery and lineup
    inspection remain available.
  missing_component_description: >-
    This Balun build lacks a codec or GStreamer plugin needed for %{channel} on %{device}. Device discovery
    and lineup inspection remain available.
  protected_title: "Protected channel unsupported"
  protected_description: >-
    %{channel} on %{device} is protected and cannot be played. Device discovery and lineup inspection remain
    available.
  internal_title: "Playback failed"
  internal_description: >-
    Playback of %{channel} on %{device} stopped because of an internal error. Device discovery and lineup
    inspection remain available.
  generic_title: "Unable to play channel"
  generic_description: >-
    The selected channel could not be started. Device discovery and lineup inspection remain available.
  stop_title: "Unable to stop live TV"
  stop_description: "Playback could not be stopped cleanly. Close Balun before selecting another channel."
  selected_device: "the selected device"
  selected_channel: "the selected channel"
  channel_number: "channel %{number}"

settings:
  unavailable: "Settings cannot be saved; changes apply to this session only."
