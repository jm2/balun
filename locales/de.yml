  ready_description: >-
    Die Wiedergabe mit GStreamer %{version} ist verfügbar. Aktivieren Sie einen Kanal, um Live-TV zu starten.
  missing_title: "Wiedergabekomponenten nicht verfügbar"
  missing_description: "Erforderliche GStreamer-Komponenten fehlen: %{missing}."
  failed_title: "Wiedergabeinitialisierung nicht verfügbar"
  main_context_description: >-
    Für die Initialisierung der Balun-Wiedergabe muss der standardmäßige GLib-Hauptkontext übernommen werden.
    Gerätesuche und Kanalliste bleiben verfügbar.
  initialization_failed_description: >-
    GStreamer konnte nicht initialisiert werden. Gerätesuche und Kanalliste bleiben verfügbar.
  old_runtime_description: >-
    GStreamer %{found} ist zu alt. Balun benötigt GStreamer %{minimum} oder neuer. Gerätesuche und Kanalliste
    bleiben verfügbar.

device_dialogs:
  find_title: "Gerät über Adresse suchen"
  find_description: >-
    Eine begrenzte HDHomeRun-Suchanfrage an eine bekannte IP-Adresse oder einen Hostnamen senden; Balun
    durchsucht keinen Adressbereich. Beispiel: 192.168.1.20, fd00::20 oder tuner.example.
  target: "IP-Adresse oder Hostname"
  cancel: "Abbrechen"
  find: "Suchen"
  enter_target: "Geben Sie die IP-Adresse oder den Hostnamen eines Geräts ein."
  hostname_characters: "Geben Sie einen Hostnamen aus Buchstaben, Ziffern, Bindestrichen und Punkten ein."
  hostname_syntax: "Geben Sie einen Hostnamen ohne URL, Port, Pfad oder Adressbereich ein."
  unicast: "Geben Sie eine verwendbare Unicast-Adresse des Geräts ein."
  numeric_address: "Geben Sie eine verwendbare numerische IPv4- oder IPv6-Adresse ein."
  address_syntax: "Geben Sie eine IP-Adresse oder einen Hostnamen ohne URL, Port oder Adressbereich ein."
  ipv4_direct: "Geben Sie die IPv4-Adresse direkt ein."
  link_local: "Link-lokales IPv6 wird noch nicht unterstützt; verwenden Sie IPv4 oder IPv6 ohne Bereichskennung."
  scoped: "IPv6 mit Bereichskennung wird noch nicht unterstützt; verwenden Sie IPv4 oder IPv6 ohne Bereichskennung."
  forget_menu: "Gerät vergessen…"
  forget_heading: "Dieses Gerät vergessen?"
  forget_description: >-
    Balun fragt die gespeicherte Adresse oder den Namen von „%{device}“ beim Start nicht mehr ab. Das Gerät
    bleibt bis zum nächsten Start in der Liste.
  forget: "Vergessen"
  forgotten: "Gerät vergessen."
  forgotten_session: "Gerät nur für diese Sitzung vergessen; die Einstellungen sind schreibgeschützt."

subnet_search:
  button: "Subnetz durchsuchen"
  unavailable: "Die Subnetzsuche ist nicht verfügbar, bis Balun Netzwerkänderungen überwacht."
  title: "Subnetz durchsuchen"
  description: >-
    Geben Sie ein privates IPv4-Subnetz von /23 bis /32 ein, zum Beispiel 192.168.2.0/23. Sie bestätigen die Suche,
    bevor Balun etwas sendet.
  entry: "Privates Subnetz"
  preview: "Adressen: %{candidates}. Ausgehende Anfragen: höchstens %{requests}."
  invalid_syntax: "Geben Sie ein IPv4-Subnetz in CIDR-Schreibweise ein, zum Beispiel 192.168.2.0/24."
  noncanonical: "Geben Sie die Netzwerkadresse ohne Host-Bits ein, zum Beispiel 192.168.2.0/23."
  too_wide: "Geben Sie ein Subnetz von /23 bis /32 ein."
  not_private: "Geben Sie ein Subnetz im privaten IPv4-Adressbereich ein."
  cancel: "Abbrechen"
  continue: "Weiter"
  forget: "Subnetz vergessen"
  confirm_heading: "%{subnet} durchsuchen?"
  confirm_body: >-
    Sie haben %{subnet} eingegeben. Adressen: %{candidates}. Budget für ausgehende Anfragen: höchstens %{requests}
    Anfragen, 64 pro Sekunde, bis zu 30 Sekunden lang. Das aktuelle Netzwerk-Routing Ihres Systems wählt den Weg. Das
    Budget begrenzt, was Balun sendet, nicht was Router zustellen.
  search: "Suchen"
  searching: "Das bestätigte Subnetz wird nach HDHomeRun-Geräten durchsucht."
  busy: "Balun ist beschäftigt; versuchen Sie die Subnetzsuche gleich noch einmal."
  confirmation_expired: "Das Netzwerk hat sich geändert; prüfen Sie die Subnetzsuche erneut."
  forgotten: "Gespeichertes Subnetz vergessen."
  forgotten_session: "Subnetz nur für diese Sitzung vergessen; die Einstellungen sind schreibgeschützt."
  stopped_title: "Subnetzsuche gestoppt"
  stopped: "Es läuft keine Subnetzsuche."
  searching_title: "Subnetz wird durchsucht"
  searching_status: "Warten auf Antworten aus dem bestätigten Subnetz; das dauert bis zu 30 Sekunden."
  complete_title: "Subnetzsuche abgeschlossen"
  complete: "Jede Adresse im bestätigten Subnetz wurde abgefragt."
  none_title: "Keine HDHomeRun-Geräte im Subnetz gefunden"
  none: "Aus dem bestätigten Subnetz kam keine gültige Antwort."
  incomplete_title: "Subnetzsuche unvollständig"
  deadline: "Die Suche hat ihr 30-Sekunden-Limit erreicht, bevor jede Adresse abgefragt wurde."
  device_limit: "Die Suche wurde nach 64 gefundenen Geräten beendet, ihrem Limit."
  unavailable_title: "Subnetzsuche nicht verfügbar"
  unavailable_status: "Balun überwacht keine Netzwerkänderungen und kann deshalb gerade kein Subnetz durchsuchen."
  stale_title: "Subnetzsuche nicht gestartet"
  stale: "Das Netzwerk hat sich nach Ihrer Bestätigung geändert. Bestätigen Sie die Suche erneut."
  changed: >-
    Das Netzwerk hat sich während der Suche geändert, daher wurden ihre Antworten verworfen. Suchen Sie erneut, um das
    Subnetz für dieses Netzwerk zu bestätigen.
  failed_title: "Subnetzsuche fehlgeschlagen"
  failed: "Die Subnetzsuche konnte nicht abgeschlossen werden."
  banner_complete: "Subnetzsuche abgeschlossen."
  banner_none: "Aus dem Subnetz kamen keine HDHomeRun-Antworten."
  banner_deadline: "Subnetzsuche unvollständig: Zeitlimit erreicht."
  banner_device_limit: "Subnetzsuche unvollständig: Gerätelimit erreicht."
  banner_changed: "Netzwerk geändert; die Subnetzsuche wurde gestoppt."
  banner_stale: "Netzwerk geändert; bestätigen Sie die Subnetzsuche erneut."
  banner_unavailable: "Die Subnetzsuche ist gerade nicht verfügbar."
  banner_failed: "Subnetzsuche fehlgeschlagen."

failure:
  busy_title: "Kein Tuner verfügbar"
  busy_description: "Alle Tuner auf %{device} sind belegt. Gerätesuche und Kanallistenansicht bleiben verfügbar."
  channel_title: "Kanal nicht verfügbar"
  channel_description: >-
    %{device} bietet %{channel} nicht mehr an. Lesen Sie die Kanalliste mit „Kanäle neu laden“ erneut ein.
    Gerätesuche und Kanallistenansicht bleiben verfügbar.
  rejected_title: "Gerät hat den Stream abgelehnt"
  rejected_description: >-
    %{device} hat die Anfrage für %{channel} abgelehnt. Gerätesuche und Kanallistenansicht bleiben
    verfügbar.
  offline_title: "Gerät oder Stream nicht verfügbar"
  offline_description: >-
    %{device} hat %{channel} nicht geliefert. Prüfen Sie, ob das Gerät eingeschaltet und erreichbar ist.
    Gerätesuche und Kanallistenansicht bleiben verfügbar.
  codec_title: "Erforderliche Wiedergabekomponente oder Codec nicht verfügbar"
  missing_audio_description: >-
    Dieser Balun-Version fehlt ein %{codec}-Audiodecoder für %{channel} auf %{device}. Gerätesuche und
    Kanallistenansicht bleiben verfügbar.
  missing_video_description: >-
    Dieser Balun-Version fehlt ein %{codec}-Videodecoder für %{channel} auf %{device}. Gerätesuche und
    Kanallistenansicht bleiben verfügbar.
  missing_component_description: >-
    Dieser Balun-Version fehlt ein Codec oder GStreamer-Plugin für %{channel} auf %{device}. Gerätesuche und
    Kanallistenansicht bleiben verfügbar.
  protected_title: "Geschützter Kanal nicht unterstützt"
  protected_description: >-
    %{channel} auf %{device} ist geschützt und kann nicht wiedergegeben werden. Gerätesuche und
    Kanallistenansicht bleiben verfügbar.
  internal_title: "Wiedergabe fehlgeschlagen"
  internal_description: >-
    Die Wiedergabe von %{channel} auf %{device} wurde wegen eines internen Fehlers beendet. Gerätesuche und
    Kanallistenansicht bleiben verfügbar.
  generic_title: "Kanal kann nicht wiedergegeben werden"
  generic_description: >-
    Der ausgewählte Kanal konnte nicht gestartet werden. Gerätesuche und Kanallistenansicht bleiben
    verfügbar.
  stop_title: "Live-TV kann nicht gestoppt werden"
  stop_description: >-
    Die Wiedergabe konnte nicht ordnungsgemäß gestoppt werden. Schließen Sie Balun, bevor Sie einen anderen
    Kanal auswählen.
  selected_device: "das ausgewählte Gerät"
  selected_channel: "der ausgewählte Kanal"
  channel_number: "Kanal %{number}"

