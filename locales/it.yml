startup:
  ready_title: "Seleziona un canale"
  ready_description: >-
    La riproduzione con GStreamer %{version} è disponibile; attiva un canale per avviare la TV in diretta.
  missing_title: "Componenti di riproduzione non disponibili"
  missing_description: "Mancano i componenti GStreamer richiesti: %{missing}."
  failed_title: "Inizializzazione della riproduzione non disponibile"
  main_context_description: >-
    L’inizializzazione della riproduzione di Balun richiede il controllo del contesto principale predefinito di
    GLib. La ricerca dei dispositivi e la consultazione dei canali restano disponibili.
  initialization_failed_description: >-
    Impossibile inizializzare GStreamer. La ricerca dei dispositivi e la consultazione dei canali restano
    disponibili.
  old_runtime_description: >-
    GStreamer %{found} è troppo vecchio; Balun richiede GStreamer %{minimum} o successivo. La ricerca dei
    dispositivi e la consultazione dei canali restano disponibili.

device_dialogs:
  find_title: "Trova dispositivo per indirizzo"
  find_description: >-
    Invia una richiesta di rilevamento HDHomeRun limitata a un indirizzo IP o nome host noto; Balun non
    esamina un intervallo di indirizzi. Esempio: 192.168.1.20, fd00::20 o tuner.example.
  target: "Indirizzo IP o nome host"
  cancel: "Annulla"
  find: "Trova"
  enter_target: "Inserisci l’indirizzo IP o il nome host di un dispositivo."
  hostname_characters: "Inserisci un nome host composto da lettere, cifre, trattini e punti."
  hostname_syntax: "Inserisci un nome host senza URL, porta, percorso o intervallo."
  unicast: "Inserisci un indirizzo unicast utilizzabile per il dispositivo."
  numeric_address: "Inserisci un indirizzo numerico IPv4 o IPv6 utilizzabile."
  address_syntax: "Inserisci un indirizzo IP o nome host senza URL, porta o intervallo."
  ipv4_direct: "Inserisci direttamente l’indirizzo IPv4."
  link_local: "IPv6 link-local non è ancora supportato; usa IPv4 o IPv6 senza identificatore di zona."
  scoped: "IPv6 con identificatore di zona non è ancora supportato; usa IPv4 o IPv6 senza identificatore di zona."
  forget_menu: "Dimentica dispositivo…"
  forget_heading: "Dimenticare questo dispositivo?"
  forget_description: >-
    Balun smetterà di interrogare l’indirizzo o il nome memorizzato di «%{device}» all’avvio. Il dispositivo
    resterà nell’elenco fino al prossimo avvio.
  forget: "Dimentica"
  forgotten: "Dispositivo dimenticato."
  forgotten_session: "Dispositivo dimenticato solo per questa sessione; le impostazioni sono di sola lettura."
  remember_menu: "Memorizza dispositivo"
  remembered: "Dispositivo memorizzato."
  remembered_session: "Dispositivo memorizzato solo per questa sessione; le impostazioni sono di sola lettura."
  remember_unavailable: "Impossibile memorizzare l’indirizzo di questo dispositivo."

subnet_search:
  button: "Cerca in una sottorete"
  unavailable: "La ricerca nella sottorete non è disponibile finché Balun non monitora le modifiche di rete."
  title: "Cerca in una sottorete"
  description: >-
    Inserisci una sottorete IPv4 privata da /23 a /32, per esempio 192.168.2.0/23. Confermerai la ricerca prima che
    Balun invii qualcosa.
  entry: "Sottorete privata"
  preview: "Indirizzi: %{candidates}. Richieste in uscita: al massimo %{requests}."
  invalid_syntax: "Inserisci una sottorete IPv4 in notazione CIDR, per esempio 192.168.2.0/24."
  noncanonical: "Inserisci l’indirizzo di rete senza bit host, per esempio 192.168.2.0/23."
  too_wide: "Inserisci una sottorete da /23 a /32."
  not_private: "Inserisci una sottorete nello spazio di indirizzi IPv4 privati."
  cancel: "Annulla"
  continue: "Continua"
  forget: "Dimentica sottorete"
  confirm_heading: "Cercare in %{subnet}?"
  confirm_body: >-
    Hai inserito %{subnet}. Indirizzi: %{candidates}. Budget di richieste in uscita: al massimo %{requests} richieste,
    64 al secondo, per un massimo di 30 secondi. Il routing di rete attuale del sistema sceglie il percorso. Il budget
    limita ciò che Balun invia, non ciò che i router recapitano.
  search: "Cerca"
  searching: "Ricerca di dispositivi HDHomeRun nella sottorete confermata."
  busy: "Balun è occupato; riprova la ricerca nella sottorete tra un momento."
  confirmation_expired: "La rete è cambiata; rivedi di nuovo la ricerca nella sottorete."
  forgotten: "Sottorete memorizzata dimenticata."
  forgotten_session: "Sottorete dimenticata solo per questa sessione; le impostazioni sono di sola lettura."
  stopped_title: "Ricerca nella sottorete interrotta"
  stopped: "Nessuna ricerca nella sottorete in corso."
  searching_title: "Ricerca nella sottorete"
  searching_status: "In attesa di risposte dalla sottorete confermata; può richiedere fino a 30 secondi."
  complete_title: "Ricerca nella sottorete completata"
  complete: "Ogni indirizzo della sottorete confermata è stato interrogato."
  none_title: "Nessun dispositivo HDHomeRun trovato nella sottorete"
  none: "Nessuna risposta valida è arrivata dalla sottorete confermata."
  incomplete_title: "Ricerca nella sottorete incompleta"
  deadline: "La ricerca ha raggiunto il limite di 30 secondi prima di interrogare ogni indirizzo."
  device_limit: "La ricerca si è fermata dopo aver trovato 64 dispositivi, il suo limite."
  unavailable_title: "Ricerca nella sottorete non disponibile"
  unavailable_status: "Balun non sta monitorando le modifiche di rete, quindi ora non può cercare in una sottorete."
  stale_title: "Ricerca nella sottorete non avviata"
  stale: "La rete è cambiata dopo la conferma della ricerca. Confermala di nuovo."
  changed: >-
    La rete è cambiata durante la ricerca, quindi le sue risposte sono state scartate. Cerca di nuovo per confermare la
    sottorete per questa rete.
  failed_title: "Ricerca nella sottorete non riuscita"
  failed: "Non è stato possibile completare la ricerca nella sottorete."
  banner_complete: "Ricerca nella sottorete completata."
  banner_none: "Nessuna risposta HDHomeRun è arrivata dalla sottorete."
  banner_deadline: "Ricerca nella sottorete incompleta: limite di tempo raggiunto."
  banner_device_limit: "Ricerca nella sottorete incompleta: limite di dispositivi raggiunto."
  banner_changed: "Rete cambiata; la ricerca nella sottorete si è fermata."
  banner_stale: "Rete cambiata; conferma di nuovo la ricerca nella sottorete."
  banner_unavailable: "La ricerca nella sottorete non è disponibile al momento."
  banner_failed: "Ricerca nella sottorete non riuscita."

failure:
  busy_title: "Nessun sintonizzatore disponibile"
  busy_description: >-
    Tutti i sintonizzatori di %{device} sono occupati. La ricerca dei dispositivi e la consultazione dei
    canali restano disponibili.
  channel_title: "Canale non disponibile"
  channel_description: >-
    %{device} non offre più %{channel}. Usa Ricarica canali per rileggere l’elenco. La ricerca dei
    dispositivi e la consultazione dei canali restano disponibili.
  rejected_title: "Il dispositivo ha rifiutato il flusso"
  rejected_description: >-
    %{device} ha rifiutato la richiesta per %{channel}. La ricerca dei dispositivi e la consultazione dei
    canali restano disponibili.
  offline_title: "Dispositivo o flusso non disponibile"
  offline_description: >-
    %{device} non ha trasmesso %{channel}. Verifica che il dispositivo sia acceso e raggiungibile. La
    ricerca dei dispositivi e la consultazione dei canali restano disponibili.
  codec_title: "Componente di riproduzione o codec richiesto non disponibile"
  missing_audio_description: >-
    Questa versione di Balun non ha un decodificatore audio %{codec} per %{channel} su %{device}. La ricerca
    dei dispositivi e la consultazione dei canali restano disponibili.
  missing_video_description: >-
    Questa versione di Balun non ha un decodificatore video %{codec} per %{channel} su %{device}. La ricerca
    dei dispositivi e la consultazione dei canali restano disponibili.
  missing_component_description: >-
    A questa versione di Balun manca un codec o un plugin GStreamer necessario per %{channel} su %{device}.
    La ricerca dei dispositivi e la consultazione dei canali restano disponibili.
  protected_title: "Canale protetto non supportato"
  protected_description: >-
    %{channel} su %{device} è protetto e non può essere riprodotto. La ricerca dei dispositivi e la
    consultazione dei canali restano disponibili.
  internal_title: "Riproduzione non riuscita"
  internal_description: >-
    La riproduzione di %{channel} su %{device} si è interrotta a causa di un errore interno. La ricerca dei
    dispositivi e la consultazione dei canali restano disponibili.
  generic_title: "Impossibile riprodurre il canale"
  generic_description: >-
    Non è stato possibile avviare il canale selezionato. La ricerca dei dispositivi e la consultazione dei
    canali restano disponibili.
  stop_title: "Impossibile arrestare la TV in diretta"
  stop_description: >-
    Non è stato possibile arrestare correttamente la riproduzione. Chiudi Balun prima di selezionare un
    altro canale.
  selected_device: "il dispositivo selezionato"
  selected_channel: "il canale selezionato"
  channel_number: "canale %{number}"

settings:
  unavailable: "Impossibile salvare le impostazioni; le modifiche valgono solo per questa sessione."
