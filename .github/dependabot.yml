version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Compiler-floor proposals are independent of action implementation updates.
  # They require synchronization and the complete CI matrix before adoption.
  - package-ecosystem: rust-toolchain
    directory: /build-aux/toolchain
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    # This manifest proposes an X.Y compiler floor, tested at X.Y.0.
    # Build jobs track stable independently and receive compiler patch fixes.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
