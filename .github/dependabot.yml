version: 2

updates:
  - package-ecosystem: npm
    directory: /build-aux/toolchain/node-lint
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 5
    groups:
      node-lint-tools:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    groups:
      cargo-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The release compiler, including patch fixes. Release jobs read the manifest,
  # so a proposal changes one file and merges automatically once CI passes.
  # The compiler floor (build-aux/toolchain) is raised deliberately with
  # scripts/sync_rust_toolchain.py, not proposed here.
  - package-ecosystem: rust-toolchain
    directory: /build-aux/release-toolchain
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 5
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
