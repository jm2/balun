name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Linux quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare adversarial replay environment
        run: |
          printf 'TMPDIR=%s\nBALUN_ADVERSARIAL_FAILURE_DIR=%s/adversarial-counterexamples\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'XDG_CACHE_HOME=%s/tool-cache\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          python3 --version
          pwsh --version

      - name: Test pinned release component policy
        run: build-aux/packaging/test-release-component-policy.sh

      - name: Test Linux package compliance scaffolding
        run: |
          python3 -B build-aux/linux/test_archive_snapshot.py
          python3 -B build-aux/linux/test_rpm_payload.py
          python3 -B build-aux/linux/test_tar_payload.py
          build-aux/linux/test-package-compliance.sh

      - name: Test Linux build helper policy
        run: scripts/test-build-linux-policy.sh

      - name: Test Flatpak permission policy scaffolding
        run: build-aux/flatpak/test-permissions.sh

      - name: Test macOS build helper policy
        run: scripts/test-build-macos-policy.sh

      - name: Test macOS icon policy scaffolding
        run: scripts/test-macos-icon-bundle-policy.sh

      - name: Test macOS package policy scaffolding
        run: scripts/test-macos-package-policy.sh

      - name: Test macOS native dependency closure
        run: python3 -B scripts/test_macos_native_closure.py

      - name: Test native inventory membership and SBOM generation
        run: |
          python3 -B scripts/inventory/test_native_inventory.py
          python3 -B scripts/inventory/test_observe_native.py
          python3 -B scripts/inventory/test_homebrew_metadata.py
          python3 -B scripts/inventory/test_native_copy_ledger.py
          python3 -B scripts/inventory/test_bind_final_native.py

      - name: Adversarial package metadata smoke
        run: |
          python3 -B scripts/test_adversarial_packages.py
          pwsh -NoProfile -File scripts/test-adversarial-installer.ps1

      - name: Install pinned portable coverage tools
        run: |
          python3 -m venv "$RUNNER_TEMP/package-coverage-python"
          "$RUNNER_TEMP/package-coverage-python/bin/pip" install \
            --require-hashes --only-binary=:all: -r scripts/coverage/requirements.txt

      - name: Install pinned PowerShell coverage profiler
        shell: pwsh
        run: >-
          Save-Module -Name Pester -RequiredVersion 6.2.0 -Repository PSGallery
          -Path "$env:RUNNER_TEMP/coverage-modules" -Force -ErrorAction Stop

      - name: Measure and ratchet portable package gates
        run: |
          python3 -B -m unittest discover -s scripts/coverage -p 'test_*.py'
          "$RUNNER_TEMP/package-coverage-python/bin/python" -B scripts/coverage/run-packages.py \
            --output "$RUNNER_TEMP/package-coverage" \
            --pester-module "$RUNNER_TEMP/coverage-modules/Pester/6.2.0/Pester.psd1"

      - name: Retain portable package coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-coverage-packages
          path: ${{ runner.temp }}/package-coverage/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Test packaged-hardware output privacy
        run: scripts/test-hardware-validation-privacy.sh

      - name: Test Rust toolchain policy
        run: |
          python3 scripts/test_rust_toolchain_policy.py
          python3 scripts/sync_rust_toolchain.py --check

      - name: Test release version agreement policy
        run: python3 scripts/test_release_check.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Cross-check the GTK-free library and its tests for Windows without warnings
        run: |
          rustup target add x86_64-pc-windows-gnullvm
          RUSTFLAGS="-D warnings" cargo check --locked --all-targets --target x86_64-pc-windows-gnullvm

      - name: Test (debug)
        run: cargo test --all-targets --locked

      - name: Test (release)
        run: cargo test --release --all-targets --locked

      - name: Retain synthetic counterexample replay records
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adversarial-smoke-counterexamples
          path: ${{ runner.temp }}/adversarial-counterexamples/*.txt
          if-no-files-found: ignore
          retention-days: 14

  desktop-metadata:
    name: Desktop metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            appstream desktop-file-utils rpm cpio dpkg libarchive-tools zstd

      - name: Test native RPM payload preflight and extraction
        run: python3 -B build-aux/linux/test_rpm_payload.py NativeToolsTests

      - name: Test native Debian and Arch payload preflight and extraction
        run: |
          for tool in dpkg-deb bsdtar zstd tar; do command -v "$tool"; done
          python3 -B build-aux/linux/test_tar_payload.py NativeToolsTests

      - name: Validate the desktop entry
        run: |
          status=0
          output="$(desktop-file-validate data/io.github.jm2.Balun.desktop 2>&1)" \
            || status=$?
          if [ "$status" -ne 0 ] || [ -n "$output" ]; then
            printf '%s\n' "$output" >&2
            exit 1
          fi

      - name: Validate the AppStream metainfo
        run: appstreamcli validate --no-net data/io.github.jm2.Balun.metainfo.xml

      - name: Check icon formats and sizes
        run: |
          python3 - <<'EOF'
          import struct
          import sys
          import xml.etree.ElementTree as ET

          HICOLOR = 'data/icons/hicolor'
          APP_ID = 'io.github.jm2.Balun'
          # The names and sizes scripts/macos-icon-bundle-policy.sh requires.
          ICONSET = (
              ('icon_16x16.png', 16), ('icon_16x16@2x.png', 32),
              ('icon_32x32.png', 32), ('icon_32x32@2x.png', 64),
              ('icon_128x128.png', 128), ('icon_128x128@2x.png', 256),
              ('icon_256x256.png', 256), ('icon_256x256@2x.png', 512),
              ('icon_512x512.png', 512), ('icon_512x512@2x.png', 1024),
          )
          failures = []

          def read(path, limit=None):
              try:
                  with open(path, 'rb') as handle:
                      return handle.read() if limit is None else handle.read(limit)
              except OSError as error:
                  failures.append(f'{path}: {error.strerror}')
                  return None

          def require_png(path, size):
              header = read(path, 24)
              if header is None:
                  return
              if header[:8] != b'\x89PNG\r\n\x1a\n' or header[12:16] != b'IHDR':
                  failures.append(f'{path}: not a PNG')
                  return
              width, height = struct.unpack('>II', header[16:24])
              expected = size if isinstance(size, tuple) else (size, size)
              if (width, height) != expected:
                  failures.append(f'{path}: {width}x{height}, expected {expected[0]}x{expected[1]}')

          def require_svg(path):
              try:
                  root = ET.parse(path).getroot()
              except (OSError, ET.ParseError) as error:
                  failures.append(f'{path}: {error}')
                  return
              if root.tag != '{http://www.w3.org/2000/svg}svg':
                  failures.append(f'{path}: root element is {root.tag}, not svg')

          def require_ico(path):
              data = read(path)
              if data is None:
                  return
              if len(data) < 6 or struct.unpack('<HH', data[:4]) != (0, 1):
                  failures.append(f'{path}: not an ICO')
                  return
              count = struct.unpack('<H', data[4:6])[0]
              if count == 0:
                  failures.append(f'{path}: contains no images')
              for index in range(count):
                  entry = data[6 + 16 * index:22 + 16 * index]
                  if len(entry) < 16:
                      failures.append(f'{path}: icon directory is truncated')
                      break
                  size, offset = struct.unpack('<II', entry[8:16])
                  if size == 0 or offset + size > len(data):
                      failures.append(f'{path}: image {index} lies outside the file')

          for size in (16, 24, 32, 48, 64, 128, 256, 512):
              require_png(f'{HICOLOR}/{size}x{size}/apps/{APP_ID}.png', size)
          for name, size in ICONSET:
              require_png(f'data/balun.iconset/{name}', size)
          require_png('data/balun.png', 1024)
          require_png('data/screenshots/balun-main-window.png', (1280, 720))
          require_svg(f'{HICOLOR}/scalable/apps/{APP_ID}.svg')
          require_svg(f'{HICOLOR}/symbolic/apps/{APP_ID}-symbolic.svg')
          require_ico('data/balun.ico')
          if failures:
              print('\n'.join(failures), file=sys.stderr)
              sys.exit(1)
          EOF

  flatpak:
    name: Flatpak (x86_64)
    runs-on: ubuntu-24.04
    container:
      # yamllint disable-line rule:line-length
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50@sha256:78bf5fcf1faca196ce6cdf34a317560e533e870861bbb752bdd3ad66d22ba0e9
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the manifest's permission policy
        run: |
          build-aux/flatpak/test-permissions.sh
          build-aux/flatpak/validate-permissions.sh build-aux/flatpak/io.github.jm2.Balun.yml

      - name: Test Linux package compliance policy
        run: |
          command -v ostree
          command -v readelf
          build-aux/linux/test-package-compliance.sh
          build-aux/linux/validate-package-metadata.sh

      - name: Install the pinned cargo-source generator dependencies
        run: |
          unset PYTHONPATH PYTHONHOME
          python3 -m venv --without-pip "$RUNNER_TEMP/flatpak-generator"
          python3 -m pip --python "$RUNNER_TEMP/flatpak-generator/bin/python" install \
            --require-hashes --only-binary=:all: \
            --requirement build-aux/flatpak/generator-lock-requirements.txt

      - name: Generate cargo-sources.json from Balun's lockfile
        run: |
          unset PYTHONPATH PYTHONHOME
          PYTHON="$RUNNER_TEMP/flatpak-generator/bin/python" bash build-aux/flatpak/generate-cargo-sources.sh

      - name: Build the Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: balun.flatpak
          manifest-path: build-aux/flatpak/io.github.jm2.Balun.yml
          cache-key: flatpak-${{ hashFiles('**/Cargo.lock') }}
          upload-artifact: false

      - name: Reopen and validate the completed bundle
        run: build-aux/flatpak/validate-bundle-compliance.sh balun.flatpak

      - name: Probe the packaged runtime for the playback factories
        run: build-aux/flatpak/validate-bundle-runtime.sh balun.flatpak

      - name: Upload the Flatpak bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: balun-flatpak-x86_64
          path: balun.flatpak
          if-no-files-found: error
          retention-days: 7

  audit:
    name: Security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit the dependency lockfile
        run: cargo audit

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install locked Markdown and TOML lint tools
        run: |
          mkdir "$RUNNER_TEMP/node-lint"
          cp build-aux/toolchain/node-lint/package.json \
            build-aux/toolchain/node-lint/package-lock.json "$RUNNER_TEMP/node-lint/"
          npm ci --prefix "$RUNNER_TEMP/node-lint" --ignore-scripts --engine-strict --include=dev \
            --no-audit --no-fund

      - name: Lint Markdown
        run: '"$RUNNER_TEMP/node-lint/node_modules/.bin/markdownlint-cli2" "**/*.md"'

      - name: Lint TOML
        run: |
          "$RUNNER_TEMP/node-lint/node_modules/.bin/taplo" check \
            Cargo.toml build-aux/toolchain/rust-toolchain.toml taplo.toml
          "$RUNNER_TEMP/node-lint/node_modules/.bin/taplo" fmt --check \
            Cargo.toml build-aux/toolchain/rust-toolchain.toml taplo.toml

      - name: Lint YAML
        run: |
          python3 -m venv "$RUNNER_TEMP/yamllint"
          "$RUNNER_TEMP/yamllint/bin/python" -m pip install --require-hashes --only-binary=:all: \
            --requirement build-aux/toolchain/yaml-lint-requirements.txt
          "$RUNNER_TEMP/yamllint/bin/yamllint" --strict .

      - name: Check reviewed builder image pins
        run: |
          "$RUNNER_TEMP/yamllint/bin/python" -B scripts/check_builder_images.py
          "$RUNNER_TEMP/yamllint/bin/python" -B scripts/test_builder_images.py

      - name: Lint GitHub Actions workflows
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" actionlint
          ./actionlint

  msrv:
    # Cargo.toml's declared floor is rustc 1.98.
    name: MSRV
    runs-on: ubuntu-24.04
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - name: Install desktop build dependencies (Fedora)
        run: >-
          dnf install -y gcc gstreamer1-devel gtk4-devel libadwaita-devel
          pkgconf-pkg-config git curl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain (1.98)
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.98.0

      - name: Check all targets and features with the declared minimum
        run: cargo check --all-targets --all-features --locked

  desktop:
    name: Linux desktop
    runs-on: ubuntu-24.04
    container:
      image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
    steps:
      - name: Install desktop build dependencies (Fedora)
        run: >-
          dnf install -y binutils dbus-daemon gcc gstreamer1-devel
          gstreamer1-plugin-gtk4 gstreamer1-plugin-libav gstreamer1-plugins-bad-free
          gstreamer1-plugins-base gstreamer1-plugins-good gtk4-devel libadwaita-devel
          pkgconf-pkg-config git curl python3 wayland-utils weston

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy

      - name: Check desktop shell
        run: cargo check --locked --features desktop --bin balun

      - name: Lint all desktop targets
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Test desktop bridge
        run: cargo test --locked --features desktop --all-targets

      - name: Install the fixed coverage compiler and matching LLVM tools
        run: rustup toolchain install 1.98.0 --profile minimal --component llvm-tools-preview

      - name: Measure and ratchet critical Rust regions
        env:
          RUSTUP_TOOLCHAIN: 1.98.0
        run: |
          export TMPDIR="$RUNNER_TEMP"
          python3 -B scripts/coverage/run-rust.py --output "$RUNNER_TEMP/rust-coverage"

      - name: Retain critical Rust coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-coverage-rust
          path: ${{ runner.temp }}/rust-coverage/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Probe installed playback runtime through helper
        run: scripts/build-linux.sh --probe-playback

      - name: Smoke desktop and synthetic playback lifecycle
        env:
          BALUN_DESKTOP_TEST_BACKEND: wayland
        run: scripts/test-desktop-lifecycle.sh

      - name: Build and inspect desktop through default helper
        run: scripts/build-linux.sh

  platform-smoke:
    name: ${{ matrix.name }} compile smoke
    runs-on: ${{ matrix.runner }}
    env:
      RUST_TARGET: ${{ matrix.desktop_target }}
      MSYS_ENV: ${{ matrix.msys_env }}
      MSYSTEM: ${{ matrix.msystem }}
      MINGW_PACKAGE_PREFIX: ${{ matrix.mingw_package_prefix }}
      INNO_ARCH: ${{ matrix.inno_arch }}
    # Cap the job so a hung MSYS2 mirror fails fast and re-runs instead of
    # stalling to the 6-hour ceiling; the Windows package closure needs the
    # extra headroom.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
            desktop_target: aarch64-apple-darwin
          - name: Windows
            runner: windows-2025
            desktop_target: x86_64-pc-windows-gnullvm
            windows_arch: x86_64
            msys_env: clang64
            msystem: CLANG64
            mingw_package_prefix: mingw-w64-clang-x86_64
            inno_arch: x64
            msys_cache: true
          - name: Windows ARM64
            runner: windows-11-arm
            desktop_target: aarch64-pc-windows-gnullvm
            windows_arch: aarch64
            msys_env: clangarm64
            msystem: CLANGARM64
            mingw_package_prefix: mingw-w64-clang-aarch64
            inno_arch: arm64
            msys_cache: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test macOS package policy with system Bash
        if: runner.os == 'macOS'
        run: /bin/bash scripts/test-macos-package-policy.sh

      - name: Test macOS build helper with system Bash
        if: runner.os == 'macOS'
        run: /bin/bash scripts/test-build-macos-policy.sh

      - name: Test real Mach-O dependency closure and isolated launch
        if: runner.os == 'macOS'
        run: python3 -B scripts/test_macos_native_closure.py

      - name: Test native package observation on macOS
        if: runner.os == 'macOS'
        run: |
          python3 -B scripts/inventory/test_observe_native.py
          python3 -B scripts/inventory/test_native_copy_ledger.py
          python3 -B scripts/inventory/test_bind_final_native.py

      - name: Test packaged-hardware output privacy with system Bash
        if: runner.os == 'macOS'
        run: /bin/bash scripts/test-hardware-validation-privacy.sh

      - name: Test Windows build helper routing
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-build-windows-routing.ps1

      - name: Test native package observation on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -B scripts/inventory/test_observe_native.py

      - name: Test complete-tree Windows probe receipts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-probe-receipt.ps1

      - name: Test checksum-pinned Windows component policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-component-policy.ps1

      - name: Test Windows installer payload preflight
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installer-policy.ps1

      - name: Install macOS desktop build dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install create-dmg gstreamer gtk4 libadwaita adwaita-icon-theme pkgconf

      - name: Verify metadata from actual installed Homebrew recipes
        if: runner.os == 'macOS'
        run: |
          python3 -B scripts/inventory/test_homebrew_metadata.py
          python3 -B scripts/inventory/homebrew_metadata.py --cellar "$(brew --cellar)" \
            --member "$(pkg-config --variable=pluginsdir gstreamer-1.0)/libgstgtk4.dylib" \
            --member "$(pkg-config --variable=pluginsdir gstreamer-1.0)/libgstlibav.dylib" \
            --member "$(pkg-config --variable=prefix gdk-pixbuf-2.0)/bin/gdk-pixbuf-query-loaders" \
            > "$RUNNER_TEMP/homebrew-native-inputs.json"

      - name: Retain installed Homebrew metadata evidence
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-native-inputs
          path: ${{ runner.temp }}/homebrew-native-inputs.json
          if-no-files-found: error
          retention-days: 14

      - name: Set up Windows desktop build environment
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        env:
          __SETUP_MSYS2_USE_MAIN_MIRROR_ONLY: 'true'
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          # setup-msys2's package-cache cleanup is flaky on native ARM64.
          cache: ${{ matrix.msys_cache }}
          install: >-
            ${{ matrix.mingw_package_prefix }}-gtk4
            ${{ matrix.mingw_package_prefix }}-gstreamer
            ${{ matrix.mingw_package_prefix }}-gst-plugins-base
            ${{ matrix.mingw_package_prefix }}-gst-plugins-good
            ${{ matrix.mingw_package_prefix }}-gst-plugins-bad
            ${{ matrix.mingw_package_prefix }}-gst-plugins-rs
            ${{ matrix.mingw_package_prefix }}-gst-libav
            ${{ matrix.mingw_package_prefix }}-libadwaita
            ${{ matrix.mingw_package_prefix }}-pkg-config
            ${{ matrix.mingw_package_prefix }}-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: ${{ matrix.desktop_target }}
          components: clippy

      - name: Check all targets
        run: cargo check --all-targets --locked

      # Tributary lints every native lane with warnings denied in both
      # profiles; platform-only dead code must fail here, not in a build log.
      - name: Lint desktop and diagnostic targets on macOS
        if: runner.os == 'macOS'
        run: |
          /bin/bash scripts/build-macos.sh --clippy
          /bin/bash scripts/build-macos.sh --clippy --diagnostic

      - name: Lint desktop and diagnostic targets on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1 -Clippy
          ./scripts/build-windows.ps1 -Clippy -Diagnostic

      - name: Test playback transport on macOS
        if: runner.os == 'macOS'
        run: "cargo test --locked --features desktop --lib playback::"

      - name: Test GTK-free library on Windows
        if: runner.os == 'Windows'
        run: cargo test --lib --locked

      - name: Test desktop and isolated native-failure boundaries on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          TMPDIR: ${{ runner.temp }}
        run: ./scripts/build-windows.ps1 -Test

      - name: Build and inspect macOS diagnostic through helper
        if: runner.os == 'macOS'
        run: /bin/bash scripts/build-macos.sh --diagnostic

      # The GTK-free diagnostic builds for the native MSVC host target outside
      # MSYS2, so the job-level GNU-LLVM desktop profile must not reach it.
      - name: Build Windows diagnostic through helper
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUST_TARGET: ''
        run: ./scripts/build-windows.ps1 -Diagnostic

      - name: Build, probe, and compare the reopened macOS disk image
        if: runner.os == 'macOS'
        run: /bin/bash scripts/build-macos.sh --dmg

      - name: Bind installed metadata to every copied macOS native input
        if: runner.os == 'macOS'
        run: |
          python3 -B scripts/inventory/homebrew_metadata.py --cellar "$(brew --cellar)" \
            --copy-ledger dist/Balun.native-copies.json > "$RUNNER_TEMP/macos-native-owners.json"

      - name: Retain macOS native ownership evidence
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-native-copy-ownership
          path: |
            dist/Balun.native-copies.json
            dist/Balun.dmg.native-observed.json
            ${{ runner.temp }}/macos-native-owners.json
          if-no-files-found: error
          retention-days: 14

      - name: Probe installed playback runtime through macOS helper
        if: runner.os == 'macOS'
        run: /bin/bash scripts/build-macos.sh --probe-playback

      - name: Build Windows desktop shell through helper
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/build-windows.ps1

      - name: Probe installed playback runtime through Windows helper
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/build-windows.ps1 -ProbePlayback

      - name: Stage, probe, and archive the Windows package through helper
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/build-windows.ps1 -Zip -NoCargoBuild

      - name: Reject a changed native DLL after the successful packaged probe
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/test-windows-probe-receipt.ps1
          -StagedRoot dist/balun-windows -Profile '${{ matrix.windows_arch }}'

      - name: Install the bounded installer inspection tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Join-Path $env:RUNNER_TEMP 'balun-inno-compiler'
          ./build-aux/inno/install-compiler.ps1 -Destination $compiler
          "BALUN_ISCC=$(Join-Path $compiler 'ISCC.exe')" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $inspector = Join-Path $env:RUNNER_TEMP 'balun-inno-inspector'
          ./build-aux/inno/install-inspector.ps1 -Destination $inspector
          "BALUN_INNOEXTRACT_DIR=$inspector" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile and independently inspect the Windows installer payload
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/build-windows.ps1 -InnoSetup -SkipBundle -NoCargoBuild

      - name: Upload the Windows candidates
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: balun-windows-${{ matrix.windows_arch }}
          path: |
            dist/balun-windows.zip
            dist/balun-setup.exe
          if-no-files-found: error
          retention-days: 7
