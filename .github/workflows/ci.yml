name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Linux quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test pinned release component policy
        run: build-aux/packaging/test-release-component-policy.sh

      - name: Test Linux package compliance scaffolding
        run: build-aux/linux/test-package-compliance.sh

      - name: Test Linux build helper policy
        run: scripts/test-build-linux-policy.sh

      - name: Test Flatpak permission policy scaffolding
        run: build-aux/flatpak/test-permissions.sh

      - name: Test macOS build helper policy
        run: scripts/test-build-macos-policy.sh

      - name: Test macOS icon policy scaffolding
        run: scripts/test-macos-icon-bundle-policy.sh

      - name: Test macOS package policy scaffolding
        run: scripts/test-macos-package-policy.sh

      - name: Test Rust toolchain policy
        run: |
          python3 scripts/test_rust_toolchain_policy.py
          python3 scripts/sync_rust_toolchain.py --check

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test (debug)
        run: cargo test --all-targets --locked

      - name: Test (release)
        run: cargo test --release --all-targets --locked

  desktop-metadata:
    name: Desktop metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream desktop-file-utils

      - name: Validate the desktop entry
        run: |
          status=0
          output="$(desktop-file-validate data/io.github.jm2.Balun.desktop 2>&1)" \
            || status=$?
          if [ "$status" -ne 0 ] || [ -n "$output" ]; then
            printf '%s\n' "$output" >&2
            exit 1
          fi

      - name: Validate the AppStream metainfo
        run: appstreamcli validate --no-net data/io.github.jm2.Balun.metainfo.xml

      - name: Check icon formats and sizes
        run: |
          python3 - <<'EOF'
          import struct
          import sys
          import xml.etree.ElementTree as ET

          HICOLOR = 'data/icons/hicolor'
          APP_ID = 'io.github.jm2.Balun'
          # The names and sizes scripts/macos-icon-bundle-policy.sh requires.
          ICONSET = (
              ('icon_16x16.png', 16), ('icon_16x16@2x.png', 32),
              ('icon_32x32.png', 32), ('icon_32x32@2x.png', 64),
              ('icon_128x128.png', 128), ('icon_128x128@2x.png', 256),
              ('icon_256x256.png', 256), ('icon_256x256@2x.png', 512),
              ('icon_512x512.png', 512), ('icon_512x512@2x.png', 1024),
          )
          failures = []

          def read(path, limit=None):
              try:
                  with open(path, 'rb') as handle:
                      return handle.read() if limit is None else handle.read(limit)
              except OSError as error:
                  failures.append(f'{path}: {error.strerror}')
                  return None

          def require_png(path, size):
              header = read(path, 24)
              if header is None:
                  return
              if header[:8] != b'\x89PNG\r\n\x1a\n' or header[12:16] != b'IHDR':
                  failures.append(f'{path}: not a PNG')
                  return
              width, height = struct.unpack('>II', header[16:24])
              if (width, height) != (size, size):
                  failures.append(f'{path}: {width}x{height}, expected {size}x{size}')

          def require_svg(path):
              try:
                  root = ET.parse(path).getroot()
              except (OSError, ET.ParseError) as error:
                  failures.append(f'{path}: {error}')
                  return
              if root.tag != '{http://www.w3.org/2000/svg}svg':
                  failures.append(f'{path}: root element is {root.tag}, not svg')

          def require_ico(path):
              data = read(path)
              if data is None:
                  return
              if len(data) < 6 or struct.unpack('<HH', data[:4]) != (0, 1):
                  failures.append(f'{path}: not an ICO')
                  return
              count = struct.unpack('<H', data[4:6])[0]
              if count == 0:
                  failures.append(f'{path}: contains no images')
              for index in range(count):
                  entry = data[6 + 16 * index:22 + 16 * index]
                  if len(entry) < 16:
                      failures.append(f'{path}: icon directory is truncated')
                      break
                  size, offset = struct.unpack('<II', entry[8:16])
                  if size == 0 or offset + size > len(data):
                      failures.append(f'{path}: image {index} lies outside the file')

          for size in (16, 24, 32, 48, 64, 128, 256, 512):
              require_png(f'{HICOLOR}/{size}x{size}/apps/{APP_ID}.png', size)
          for name, size in ICONSET:
              require_png(f'data/balun.iconset/{name}', size)
          require_svg(f'{HICOLOR}/scalable/apps/{APP_ID}.svg')
          require_svg(f'{HICOLOR}/symbolic/apps/{APP_ID}-symbolic.svg')
          require_ico('data/balun.ico')
          if failures:
              print('\n'.join(failures), file=sys.stderr)
              sys.exit(1)
          EOF

  audit:
    name: Security audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit the dependency lockfile
        run: cargo audit

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: 1.7.7
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.18.1 "**/*.md"

      - name: Lint TOML
        run: |
          npx --yes @taplo/cli@0.7.0 check Cargo.toml build-aux/toolchain/rust-toolchain.toml taplo.toml
          npx --yes @taplo/cli@0.7.0 fmt --check Cargo.toml build-aux/toolchain/rust-toolchain.toml taplo.toml

      - name: Lint YAML
        run: |
          python3 -m venv "$RUNNER_TEMP/yamllint"
          "$RUNNER_TEMP/yamllint/bin/pip" install yamllint==1.37.1
          "$RUNNER_TEMP/yamllint/bin/yamllint" --strict .

      - name: Lint GitHub Actions workflows
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "$archive" actionlint
          ./actionlint

  msrv:
    # Cargo.toml's declared floor is rustc 1.98.
    name: MSRV
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    steps:
      - name: Install desktop build dependencies (Fedora)
        run: >-
          dnf install -y gcc gstreamer1-devel gtk4-devel libadwaita-devel
          pkgconf-pkg-config git curl

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain (1.98)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.98.0

      - name: Check all targets and features with the declared minimum
        run: cargo check --all-targets --all-features --locked

  desktop:
    name: Linux desktop
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    steps:
      - name: Install desktop build dependencies (Fedora)
        run: >-
          dnf install -y binutils dbus-daemon gcc gstreamer1-devel
          gstreamer1-plugin-gtk4 gstreamer1-plugin-libav gstreamer1-plugins-bad-free
          gstreamer1-plugins-base gstreamer1-plugins-good gtk4-devel libadwaita-devel
          pkgconf-pkg-config git curl wayland-utils weston

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy

      - name: Check desktop shell
        run: cargo check --locked --features desktop --bin balun

      - name: Lint desktop shell
        run: cargo clippy --locked --features desktop --bin balun -- -D warnings

      - name: Test desktop bridge
        run: cargo test --locked --features desktop --all-targets

      - name: Probe installed playback runtime through helper
        run: scripts/build-linux.sh --probe-playback

      - name: Smoke desktop and synthetic playback lifecycle
        env:
          BALUN_DESKTOP_TEST_BACKEND: wayland
        run: scripts/test-desktop-lifecycle.sh

      - name: Build and inspect desktop through default helper
        run: scripts/build-linux.sh

  platform-smoke:
    name: ${{ matrix.name }} compile smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
            desktop_target: aarch64-apple-darwin
          - name: Windows
            runner: windows-2025
            desktop_target: x86_64-pc-windows-gnullvm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test macOS package policy with system Bash
        if: runner.os == 'macOS'
        run: /bin/bash scripts/test-macos-package-policy.sh

      - name: Test macOS build helper with system Bash
        if: runner.os == 'macOS'
        run: /bin/bash scripts/test-build-macos-policy.sh

      - name: Test Windows build helper routing
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-build-windows-routing.ps1

      - name: Install macOS desktop build dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install gstreamer gtk4 libadwaita pkgconf

      - name: Set up Windows desktop build environment
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        env:
          __SETUP_MSYS2_USE_MAIN_MIRROR_ONLY: 'true'
        with:
          msystem: CLANG64
          path-type: inherit
          update: true
          cache: true
          install: >-
            mingw-w64-clang-x86_64-gtk4
            mingw-w64-clang-x86_64-gstreamer
            mingw-w64-clang-x86_64-gst-plugins-base
            mingw-w64-clang-x86_64-gst-plugins-good
            mingw-w64-clang-x86_64-gst-plugins-bad
            mingw-w64-clang-x86_64-gst-plugins-rs
            mingw-w64-clang-x86_64-libadwaita
            mingw-w64-clang-x86_64-pkg-config
            mingw-w64-clang-x86_64-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.desktop_target }}

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Test playback transport on macOS
        if: runner.os == 'macOS'
        run: "cargo test --locked --features desktop --lib playback::"

      - name: Test GTK-free library on Windows
        if: runner.os == 'Windows'
        run: cargo test --lib --locked

      - name: Build and inspect macOS diagnostic through helper
        if: runner.os == 'macOS'
        run: /bin/bash scripts/build-macos.sh --diagnostic

      - name: Build Windows diagnostic through helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Diagnostic

      - name: Build and inspect macOS desktop through default helper
        if: runner.os == 'macOS'
        run: /bin/bash scripts/build-macos.sh

      - name: Probe installed playback runtime through macOS helper
        if: runner.os == 'macOS'
        run: /bin/bash scripts/build-macos.sh --probe-playback

      - name: Build Windows desktop shell through helper
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/build-windows.ps1

      - name: Probe installed playback runtime through Windows helper
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/build-windows.ps1 -ProbePlayback
