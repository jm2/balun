name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Linux quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test pinned release component policy
        run: build-aux/packaging/test-release-component-policy.sh

      - name: Test Linux package compliance scaffolding
        run: build-aux/linux/test-package-compliance.sh

      - name: Test Linux build helper policy
        run: scripts/test-build-linux-policy.sh

      - name: Test Flatpak permission policy scaffolding
        run: build-aux/flatpak/test-permissions.sh

      - name: Test macOS icon policy scaffolding
        run: scripts/test-macos-icon-bundle-policy.sh

      - name: Test macOS package policy scaffolding
        run: scripts/test-macos-package-policy.sh

      - name: Test Rust toolchain policy
        run: |
          python3 scripts/test_rust_toolchain_policy.py
          python3 scripts/sync_rust_toolchain.py --check

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test (debug)
        run: cargo test --all-targets --locked

      - name: Test (release)
        run: cargo test --release --all-targets --locked

  msrv:
    # Cargo.toml's declared floor is rustc 1.94.
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain (1.94)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.94.0

      - name: Check all targets with the declared minimum
        run: cargo check --all-targets --locked

  platform-smoke:
    name: ${{ matrix.name }} compile smoke
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test macOS package policy with system Bash
        if: runner.os == 'macOS'
        run: /bin/bash scripts/test-macos-package-policy.sh

      - name: Test Windows build helper routing
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-build-windows-routing.ps1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Check all targets
        run: cargo check --all-targets --locked
