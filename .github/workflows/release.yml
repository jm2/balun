name: Release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag (for example, v0.1.0-alpha.1)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Resolve release source
    runs-on: ubuntu-24.04
    outputs:
      build_ref: ${{ steps.source.outputs.build_ref }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Validate requested tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          semver_tag='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "${REQUESTED_TAG}" =~ ${semver_tag} ]]; then
            echo "Release tag must be a v-prefixed semantic version; got '${REQUESTED_TAG}'" >&2
            exit 1
          fi
          echo "tag=${REQUESTED_TAG}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Test pinned release component policy
        run: build-aux/packaging/test-release-component-policy.sh

      - name: Test Linux package compliance scaffolding
        run: build-aux/linux/test-package-compliance.sh

      - name: Test Linux build helper policy
        run: scripts/test-build-linux-policy.sh

      - name: Test Flatpak permission policy scaffolding
        run: build-aux/flatpak/test-permissions.sh

      - name: Test macOS build helper policy
        run: scripts/test-build-macos-policy.sh

      - name: Test macOS icon policy scaffolding
        run: scripts/test-macos-icon-bundle-policy.sh

      - name: Test macOS package policy scaffolding
        run: scripts/test-macos-package-policy.sh

      - name: Test Rust toolchain policy
        run: |
          python3 scripts/test_rust_toolchain_policy.py
          python3 scripts/sync_rust_toolchain.py --check

      - name: Validate immutable source and version
        id: source
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]]; then
            echo "Release tag ${TAG} must be annotated" >&2
            exit 1
          fi

          build_ref="$(git rev-parse HEAD)"
          version="$(awk -F'"' '/^\[package\]/{in_package=1; next}
            in_package && /^version = /{print $2; exit}' Cargo.toml)"
          if [[ -z "${version}" ]]; then
            echo "Could not read the package version from Cargo.toml" >&2
            exit 1
          fi
          if [[ "${TAG}" != "v${version}" ]]; then
            echo "Tag ${TAG} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          if ! grep -Fq "## [${version}]" CHANGELOG.md; then
            echo "CHANGELOG.md has no ${version} release section" >&2
            exit 1
          fi

          echo "build_ref=${build_ref}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    name: ${{ matrix.name }} candidate
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            binary: target/x86_64-unknown-linux-gnu/release/balun-discover
            artifact: balun-discover-linux-x86_64
          - name: macOS arm64
            runner: macos-15
            binary: target/aarch64-apple-darwin/release/balun-discover
            artifact: balun-discover-macos-arm64
          - name: Windows x86_64
            runner: windows-2025
            binary: target/x86_64-pc-windows-msvc/release/balun-discover.exe
            artifact: balun-discover-windows-x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.build_ref }}
          persist-credentials: false

      - name: Test macOS package policy with system Bash
        if: runner.os == 'macOS'
        run: /bin/bash scripts/test-macos-package-policy.sh

      - name: Test macOS build helper with system Bash
        if: runner.os == 'macOS'
        run: /bin/bash scripts/test-build-macos-policy.sh

      - name: Test Windows build helper routing
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-build-windows-routing.ps1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Test tagged source
        run: cargo test --all-targets --locked

      - name: Build Linux discovery diagnostic
        if: runner.os == 'Linux'
        run: scripts/build-linux.sh --diagnostic

      - name: Build and inspect macOS discovery diagnostic
        if: runner.os == 'macOS'
        run: /bin/bash scripts/build-macos.sh --diagnostic

      - name: Build Windows discovery diagnostic
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Diagnostic

      - name: Upload internal candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ needs.prepare.outputs.version }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  flatpak:
    name: Flatpak ${{ matrix.arch }} candidate
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.build_ref }}
          persist-credentials: false

      - name: Install Flatpak natively on the runner
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils flatpak flatpak-builder ostree python3-pip
          sudo mkdir -p /etc/polkit-1/rules.d
          sudo tee /etc/polkit-1/rules.d/99-flatpak.rules << 'EOF'
          polkit.addRule(function(action, subject) {
              if (action.id.startsWith("org.freedesktop.Flatpak.") && subject.user === "runner") {
                  return polkit.Result.YES;
              }
          });
          EOF
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Validate the manifest's permission policy
        run: build-aux/flatpak/validate-permissions.sh build-aux/flatpak/io.github.jm2.Balun.yml

      - name: Install the pinned cargo-source generator dependencies
        run: |
          python3 -m pip install --requirement build-aux/flatpak/generator-requirements.txt \
            --break-system-packages \
            || python3 -m pip install --requirement build-aux/flatpak/generator-requirements.txt

      - name: Generate cargo-sources.json from the tagged lockfile
        run: bash build-aux/flatpak/generate-cargo-sources.sh

      - name: Build the Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: balun-linux-${{ matrix.arch }}.flatpak
          manifest-path: build-aux/flatpak/io.github.jm2.Balun.yml
          cache-key: flatpak-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          arch: ${{ matrix.arch }}
          upload-artifact: false

      - name: Reopen and validate the completed bundle
        run: build-aux/flatpak/validate-bundle-compliance.sh balun-linux-${{ matrix.arch }}.flatpak

      - name: Upload internal candidate bundle
        uses: actions/upload-artifact@v7
        with:
          name: balun-linux-${{ matrix.arch }}-flatpak-${{ needs.prepare.outputs.version }}
          path: balun-linux-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: 7
