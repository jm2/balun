name: Release candidate

# Every action this workflow runs is pinned to a full commit SHA (Dependabot
# keeps the pins and their version comments current) so a release is built
# and published only by reviewed, immutable code.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  prepare:
    name: Resolve release source
    runs-on: ubuntu-24.04
    outputs:
      build_ref: ${{ steps.source.outputs.build_ref }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Validate requested tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          semver_tag='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          if [[ ! "${REQUESTED_TAG}" =~ ${semver_tag} ]]; then
            echo "Release tag must be a v-prefixed semantic version; got '${REQUESTED_TAG}'" >&2
            exit 1
          fi
          echo "tag=${REQUESTED_TAG}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Test pinned release component policy
        run: build-aux/packaging/test-release-component-policy.sh

      - name: Test Linux package compliance policy
        run: build-aux/linux/test-package-compliance.sh

      - name: Test Linux build helper policy
        run: scripts/test-build-linux-policy.sh

      - name: Test Flatpak permission policy
        run: build-aux/flatpak/test-permissions.sh

      - name: Test macOS build helper policy
        run: scripts/test-build-macos-policy.sh

      - name: Test macOS icon policy
        run: scripts/test-macos-icon-bundle-policy.sh

      - name: Test macOS package policy
        run: scripts/test-macos-package-policy.sh

      - name: Test packaged-hardware output privacy
        run: scripts/test-hardware-validation-privacy.sh

      - name: Test Rust toolchain policy
        run: |
          python3 scripts/test_rust_toolchain_policy.py
          python3 scripts/sync_rust_toolchain.py --check

      - name: Test release version agreement policy
        run: python3 scripts/test_release_check.py

      - name: Validate immutable source and version
        id: source
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]]; then
            echo "Release tag ${TAG} must be annotated" >&2
            exit 1
          fi

          build_ref="$(git rev-parse HEAD)"
          # Every version declaration (Cargo.toml, Cargo.lock, the Arch
          # PKGBUILD pkgver, CHANGELOG, AppStream) must agree with the tag
          # before any package is built.
          python3 scripts/release_check.py --tag "${TAG}"
          version="${TAG#v}"

          echo "build_ref=${build_ref}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # The draft's body is the changelog section for this exact version, so
      # the release notes are reviewed in the tagged source, not typed later.
      - name: Extract the release notes from the changelog
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          python3 - "${VERSION}" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\Z)",
              text,
              re.M | re.S,
          )
          if section is None:
              sys.exit(f"CHANGELOG.md has no '## [{version}]' section")
          body = section.group(1).strip()
          if not body:
              sys.exit(f"CHANGELOG.md section for {version} is empty")
          Path("release-notes").mkdir()
          Path("release-notes/RELEASE_NOTES.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Upload the release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes-${{ steps.source.outputs.version }}
          path: release-notes/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.name }} candidate
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            binary: target/x86_64-unknown-linux-gnu/release/balun-discover
            artifact: balun-discover-linux-x86_64
          - name: macOS arm64
            runner: macos-15
            binary: target/aarch64-apple-darwin/release/balun-discover
            artifact: balun-discover-macos-arm64
          - name: Windows x86_64
            runner: windows-2025
            binary: target/x86_64-pc-windows-msvc/release/balun-discover.exe
            artifact: balun-discover-windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.build_ref }}
          persist-credentials: false

      - name: Test macOS package policy with system Bash
        if: runner.os == 'macOS'
        run: /bin/bash scripts/test-macos-package-policy.sh

      - name: Test macOS build helper with system Bash
        if: runner.os == 'macOS'
        run: /bin/bash scripts/test-build-macos-policy.sh

      - name: Test Windows build helper routing
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-build-windows-routing.ps1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Test tagged source
        run: cargo test --all-targets --locked

      - name: Build Linux discovery diagnostic
        if: runner.os == 'Linux'
        run: scripts/build-linux.sh --diagnostic

      - name: Build and inspect macOS discovery diagnostic
        if: runner.os == 'macOS'
        run: /bin/bash scripts/build-macos.sh --diagnostic

      - name: Build Windows discovery diagnostic
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Diagnostic

      - name: Upload internal candidate artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}-${{ needs.prepare.outputs.version }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  flatpak:
    name: Flatpak ${{ matrix.arch }} candidate
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.build_ref }}
          persist-credentials: false

      - name: Install Flatpak natively on the runner
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils flatpak flatpak-builder ostree python3-pip
          sudo mkdir -p /etc/polkit-1/rules.d
          sudo tee /etc/polkit-1/rules.d/99-flatpak.rules << 'EOF'
          polkit.addRule(function(action, subject) {
              if (action.id.startsWith("org.freedesktop.Flatpak.") && subject.user === "runner") {
                  return polkit.Result.YES;
              }
          });
          EOF
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Validate the manifest's permission policy
        run: build-aux/flatpak/validate-permissions.sh build-aux/flatpak/io.github.jm2.Balun.yml

      - name: Install the pinned cargo-source generator dependencies
        run: |
          python3 -m pip install --requirement build-aux/flatpak/generator-requirements.txt \
            --break-system-packages \
            || python3 -m pip install --requirement build-aux/flatpak/generator-requirements.txt

      - name: Generate cargo-sources.json from the tagged lockfile
        run: bash build-aux/flatpak/generate-cargo-sources.sh

      - name: Build the Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: balun-linux-${{ matrix.arch }}.flatpak
          manifest-path: build-aux/flatpak/io.github.jm2.Balun.yml
          cache-key: flatpak-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          arch: ${{ matrix.arch }}
          upload-artifact: false

      - name: Reopen and validate the completed bundle
        run: build-aux/flatpak/validate-bundle-compliance.sh balun-linux-${{ matrix.arch }}.flatpak

      - name: Probe the packaged runtime for the playback factories
        run: build-aux/flatpak/validate-bundle-runtime.sh balun-linux-${{ matrix.arch }}.flatpak

      - name: Upload internal candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: balun-linux-${{ matrix.arch }}-flatpak-${{ needs.prepare.outputs.version }}
          path: balun-linux-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS aarch64 package candidate
    needs: prepare
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.build_ref }}
          persist-credentials: false

      - name: Test macOS package policy with system Bash
        run: /bin/bash scripts/test-macos-package-policy.sh

      - name: Test macOS build helper with system Bash
        run: /bin/bash scripts/test-build-macos-policy.sh

      - name: Install macOS desktop and packaging dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install create-dmg gstreamer gtk4 libadwaita pkgconf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build, sign, probe, and reopen the macOS disk image
        run: /bin/bash scripts/build-macos.sh --dmg

      - name: Rename the disk image for release
        run: mv dist/Balun.dmg dist/balun-macos-aarch64.dmg

      - name: Upload internal candidate disk image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: balun-macos-aarch64-dmg-${{ needs.prepare.outputs.version }}
          path: dist/balun-macos-aarch64.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows ${{ matrix.arch }} package candidate
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      RUST_TARGET: ${{ matrix.rust_target }}
      MSYS_ENV: ${{ matrix.msys_env }}
      MSYSTEM: ${{ matrix.msystem }}
      MINGW_PACKAGE_PREFIX: ${{ matrix.mingw_package_prefix }}
      INNO_ARCH: ${{ matrix.inno_arch }}
    # Cap the job so a hung MSYS2 mirror fails fast and re-runs instead of
    # stalling to the 6-hour ceiling.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            rust_target: x86_64-pc-windows-gnullvm
            msys_env: clang64
            msystem: CLANG64
            mingw_package_prefix: mingw-w64-clang-x86_64
            inno_arch: x64
            msys_cache: true
          - arch: aarch64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-gnullvm
            msys_env: clangarm64
            msystem: CLANGARM64
            mingw_package_prefix: mingw-w64-clang-aarch64
            inno_arch: arm64
            msys_cache: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.build_ref }}
          persist-credentials: false

      - name: Test Windows build helper routing
        shell: pwsh
        run: ./scripts/test-build-windows-routing.ps1

      - name: Set up the Windows desktop build environment
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        env:
          __SETUP_MSYS2_USE_MAIN_MIRROR_ONLY: 'true'
        with:
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          update: true
          # setup-msys2's package-cache cleanup is flaky on native ARM64.
          cache: ${{ matrix.msys_cache }}
          install: >-
            ${{ matrix.mingw_package_prefix }}-gtk4
            ${{ matrix.mingw_package_prefix }}-gstreamer
            ${{ matrix.mingw_package_prefix }}-gst-plugins-base
            ${{ matrix.mingw_package_prefix }}-gst-plugins-good
            ${{ matrix.mingw_package_prefix }}-gst-plugins-bad
            ${{ matrix.mingw_package_prefix }}-gst-plugins-rs
            ${{ matrix.mingw_package_prefix }}-gst-libav
            ${{ matrix.mingw_package_prefix }}-libadwaita
            ${{ matrix.mingw_package_prefix }}-pkg-config
            ${{ matrix.mingw_package_prefix }}-toolchain

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Build the Windows desktop through the helper
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/build-windows.ps1

      - name: Probe the installed playback runtime through the helper
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/build-windows.ps1 -ProbePlayback

      - name: Stage, probe, and archive the Windows package through the helper
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/build-windows.ps1 -Zip -NoCargoBuild

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build the installer from the probed package through the helper
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: ./scripts/build-windows.ps1 -InnoSetup -SkipBundle -NoCargoBuild

      - name: Rename the artifacts for release
        shell: pwsh
        run: |
          Move-Item dist/balun-windows.zip dist/balun-windows-${{ matrix.arch }}.zip
          Move-Item dist/balun-setup.exe dist/balun-windows-${{ matrix.arch }}-setup.exe

      - name: Upload internal candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: balun-windows-${{ matrix.arch }}-${{ needs.prepare.outputs.version }}
          path: |
            dist/balun-windows-${{ matrix.arch }}.zip
            dist/balun-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          retention-days: 7

  linux-deb:
    name: Debian ${{ matrix.deb_arch }} package candidate
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    container:
      image: debian:sid
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            deb_arch: arm64
    steps:
      - name: Install Debian build and playback dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils build-essential ca-certificates curl git libadwaita-1-dev \
            libdbus-1-dev libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev \
            libgtk-4-dev perl pkg-config gstreamer1.0-gtk4 gstreamer1.0-libav \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.build_ref }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install the reviewed Debian package builder
        run: cargo install cargo-deb --version 3.7.0 --locked

      - name: Build and reopen the Debian package through the helper
        run: scripts/build-linux.sh --deb

      - name: Upload internal candidate Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: balun-${{ matrix.deb_arch }}-deb-${{ needs.prepare.outputs.version }}
          path: dist/balun-${{ matrix.deb_arch }}.deb
          if-no-files-found: error
          retention-days: 7

  linux-rpm:
    name: RPM ${{ matrix.rpm_arch }} package candidate
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    container:
      image: fedora:44
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            rpm_arch: aarch64
    steps:
      - name: Install RPM build and playback dependencies
        run: >-
          dnf install -y binutils ca-certificates cpio curl dbus-devel gcc git
          gstreamer1-devel gstreamer1-plugin-gtk4 gstreamer1-plugin-libav
          gstreamer1-plugins-bad-free gstreamer1-plugins-base
          gstreamer1-plugins-base-devel gstreamer1-plugins-good gtk4-devel
          libadwaita-devel perl-core pkgconf-pkg-config rpm-build

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.build_ref }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install the reviewed RPM package builder
        run: cargo install cargo-generate-rpm --version 0.21.0 --locked

      - name: Build and reopen the RPM through the helper
        run: scripts/build-linux.sh --rpm

      - name: Upload internal candidate RPM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: balun-${{ matrix.rpm_arch }}-rpm-${{ needs.prepare.outputs.version }}
          path: dist/balun-${{ matrix.rpm_arch }}.rpm
          if-no-files-found: error
          retention-days: 7

  linux-arch:
    name: Arch Linux x86_64 package candidate
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch build and playback dependencies
        run: >-
          pacman -Syu --noconfirm binutils git gst-libav gst-plugin-gtk4
          gst-plugins-bad-libs gst-plugins-base-libs gst-plugins-good gstreamer
          gtk4 libadwaita libarchive perl pkgconf rust

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.build_ref }}
          persist-credentials: false

      - name: Build and reopen the Arch package through the helper
        run: |
          useradd --create-home builder
          cp -R . /home/builder/balun
          chown -R builder:builder /home/builder/balun
          su builder -c '/home/builder/balun/scripts/build-linux.sh --arch-pkg'
          mkdir -p dist
          cp /home/builder/balun/dist/balun-x86_64.pkg.tar.zst dist/

      - name: Upload internal candidate Arch package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: balun-x86_64-arch-${{ needs.prepare.outputs.version }}
          path: dist/balun-x86_64.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: Verify artifact inventory
    needs: [prepare, build, flatpak, macos, windows, linux-deb, linux-rpm, linux-arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download every candidate artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Require the exact release inventory and write SHA256SUMS
        run: |
          cd artifacts
          expected_assets=(
            'balun-aarch64.rpm'
            'balun-amd64.deb'
            'balun-arm64.deb'
            'balun-linux-aarch64.flatpak'
            'balun-linux-x86_64.flatpak'
            'balun-macos-aarch64.dmg'
            'balun-windows-aarch64-setup.exe'
            'balun-windows-aarch64.zip'
            'balun-windows-x86_64-setup.exe'
            'balun-windows-x86_64.zip'
            'balun-x86_64.pkg.tar.zst'
            'balun-x86_64.rpm'
          )
          release_file_list="$(mktemp)"
          trap 'rm -f "$release_file_list"' EXIT
          find . -type f \
            \( -name '*.flatpak' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.pkg.tar.zst' \) \
            -print0 > "$release_file_list"
          mapfile -d '' release_files < "$release_file_list"
          if (( ${#release_files[@]} == 0 )); then
            echo 'No release artifacts were downloaded' >&2
            exit 1
          fi

          declare -A release_paths=()
          for path in "${release_files[@]}"; do
            name="${path##*/}"
            if [[ -n "${release_paths[$name]+present}" ]]; then
              echo "Duplicate release artifact filename: ${name}" >&2
              printf '  %s\n' "${release_paths[$name]}" "${path}" >&2
              exit 1
            fi
            release_paths["$name"]="$path"
          done

          if (( ${#release_paths[@]} != ${#expected_assets[@]} )); then
            echo "Expected ${#expected_assets[@]} unique release assets; found ${#release_paths[@]}" >&2
            printf '  %s\n' "${!release_paths[@]}" | LC_ALL=C sort >&2
            exit 1
          fi
          for name in "${expected_assets[@]}"; do
            if [[ -z "${release_paths[$name]+present}" ]]; then
              echo "Missing release artifact: ${name}" >&2
              exit 1
            fi
          done

          mkdir -p ../release-assets
          {
            for name in "${expected_assets[@]}"; do
              cp "${release_paths[$name]}" "../release-assets/${name}"
              digest="$(sha256sum "${release_paths[$name]}")"
              printf '%s  %s\n' "${digest%% *}" "$name"
            done
          } | LC_ALL=C sort -k2 > ../release-assets/SHA256SUMS.txt
          cat ../release-assets/SHA256SUMS.txt

      - name: Upload the verified release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ needs.prepare.outputs.version }}
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  # The only job with a repository write token. It checks out no project or
  # build code, uses immutable action revisions only, and creates a draft
  # release so nothing is public until a maintainer publishes it.
  publish:
    name: Create draft release
    needs: [prepare, checksums]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the verified release set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets-${{ needs.prepare.outputs.version }}
          path: release-assets

      - name: Download the release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-notes-${{ needs.prepare.outputs.version }}
          path: release-notes

      # A rerun must never rewrite assets on a release a maintainer has already
      # published: only a missing release or exactly one unpublished draft for
      # this tag may proceed.
      - name: Refuse to modify a published release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # A failed lookup must not look like "no release exists".
          if ! listing="$(
            gh api --paginate "repos/${REPOSITORY}/releases" \
              --jq ".[] | select(.tag_name == \"${TAG}\") | .draft"
          )"; then
            echo "Could not list the releases for ${TAG}; refusing to publish unchecked" >&2
            exit 1
          fi
          mapfile -t drafts < <(grep -v '^$' <<< "${listing}" || true)
          case "${#drafts[@]}:${drafts[0]:-}" in
            0:) echo "No release exists for ${TAG}; a draft will be created" ;;
            1:true) echo "One unpublished draft exists for ${TAG}; its assets will be replaced" ;;
            1:false)
              echo "Release ${TAG} is already published; refusing to modify it" >&2
              exit 1
              ;;
            *)
              echo "Found ${#drafts[@]} releases for ${TAG}; refusing to guess which to update" >&2
              exit 1
              ;;
          esac

      - name: Create or update the draft release for the validated tag
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Balun ${{ needs.prepare.outputs.version }}
          body_path: release-notes/RELEASE_NOTES.md
          draft: true
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/*.flatpak
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*-setup.exe
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.pkg.tar.zst
            release-assets/SHA256SUMS.txt
