<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Balun application icon. A dark-bezelled 1990s Trinitron-style CRT showing SMPTE colour
       bars, with telescoping rabbit ears joined by a balun block. GNOME-style: front-on, a
       128 px grid, flat shapes with restrained gradients and no text. Elements with
       class="fine" are hidden, and the rabbit ears thickened, when scripts/render-icons.py
       renders 32 px and smaller. -->
  <defs>
    <linearGradient id="cabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c5052"/>
      <stop offset="0.12" stop-color="#3a3e40"/>
      <stop offset="0.75" stop-color="#26292b"/>
      <stop offset="1" stop-color="#1a1d1e"/>
    </linearGradient>
    <linearGradient id="cabinetEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3032"/>
      <stop offset="1" stop-color="#1d2022"/>
    </linearGradient>
    <linearGradient id="glassTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassSweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.56" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tubeSides" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.42"/>
      <stop offset="0.12" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.88" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="tubeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.7" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="rod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f4f2"/>
      <stop offset="0.5" stop-color="#c9ccc6"/>
      <stop offset="1" stop-color="#8f938d"/>
    </linearGradient>
    <radialGradient id="knob" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#7a7e7b"/>
      <stop offset="0.6" stop-color="#3f4345"/>
      <stop offset="1" stop-color="#22262a"/>
    </radialGradient>
    <radialGradient id="ledGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8ae234" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#73d216" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#73d216" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tip" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9da19b"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <clipPath id="glass">
      <rect x="17" y="38" width="94" height="58" rx="4.5"/>
    </clipPath>
  </defs>

  <!-- soft drop shadow -->
  <g filter="url(#shadow)" opacity="0.32">
    <rect x="9" y="33" width="110" height="88" rx="10" fill="#000000"/>
  </g>

  <!-- rabbit ears: thick lower segments, thinner telescoped upper segments, ball tips -->
  <g stroke-linecap="round" fill="none">
    <path class="ear-outer" d="M64 31 L47 17.5" stroke="#16191a" stroke-width="6.6"/>
    <path class="ear-outer" d="M64 31 L81 17.5" stroke="#16191a" stroke-width="6.6"/>
    <path class="ear-outer-thin" d="M47 17.5 L31 5" stroke="#16191a" stroke-width="5"/>
    <path class="ear-outer-thin" d="M81 17.5 L97 5" stroke="#16191a" stroke-width="5"/>
    <path class="ear-metal" d="M64 31 L47 17.5" stroke="url(#rod)" stroke-width="4.4"/>
    <path class="ear-metal" d="M64 31 L81 17.5" stroke="url(#rod)" stroke-width="4.4"/>
    <path class="ear-metal-thin" d="M47 17.5 L31 5" stroke="url(#rod)" stroke-width="2.9"/>
    <path class="ear-metal-thin" d="M81 17.5 L97 5" stroke="url(#rod)" stroke-width="2.9"/>
    <path class="fine" d="M62.6 29.6 L46.6 16.6" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.9"/>
    <path class="fine" d="M65.4 29.6 L81.4 16.6" stroke="#ffffff" stroke-opacity="0.55" stroke-width="0.9"/>
  </g>
  <circle cx="31" cy="5" r="3.2" fill="url(#tip)" stroke="#16191a" stroke-width="1.1"/>
  <circle cx="97" cy="5" r="3.2" fill="url(#tip)" stroke="#16191a" stroke-width="1.1"/>

  <!-- balun feed block where the ears meet -->
  <rect x="55" y="25" width="18" height="10" rx="2.5" fill="#1d2022" stroke="#101213" stroke-width="1"/>
  <rect class="fine" x="57" y="27" width="14" height="2.2" rx="1.1" fill="#5b5f61"/>
  <rect class="fine" x="59.5" y="30.5" width="9" height="1.6" rx="0.8" fill="#3a3e40"/>

  <!-- cabinet -->
  <rect x="8" y="30" width="112" height="88" rx="9" fill="url(#cabinet)" stroke="#0e1011" stroke-width="1.2"/>
  <rect x="9.6" y="31.6" width="108.8" height="84.8" rx="7.6" fill="none" stroke="url(#cabinetEdge)" stroke-width="1.4"/>

  <!-- tube recess -->
  <rect x="14.5" y="35.5" width="99" height="63" rx="6" fill="#090b0c"/>
  <rect x="15.5" y="36.5" width="97" height="61" rx="5.4" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="1"/>

  <!-- picture: SMPTE colour bars -->
  <g clip-path="url(#glass)">
    <rect x="17" y="38" width="94" height="58" fill="#0a0d0e"/>
    <rect x="17.00" y="38" width="13.43" height="38.6" fill="#e6e6e3"/>
    <rect x="30.43" y="38" width="13.43" height="38.6" fill="#f0d31c"/>
    <rect x="43.86" y="38" width="13.43" height="38.6" fill="#33d6dc"/>
    <rect x="57.29" y="38" width="13.43" height="38.6" fill="#66cc22"/>
    <rect x="70.71" y="38" width="13.43" height="38.6" fill="#c94fc6"/>
    <rect x="84.14" y="38" width="13.43" height="38.6" fill="#d21f1f"/>
    <rect x="97.57" y="38" width="13.43" height="38.6" fill="#2d5ea8"/>
    <rect x="17.00" y="76.6" width="13.43" height="4.9" fill="#2d5ea8"/>
    <rect x="30.43" y="76.6" width="13.43" height="4.9" fill="#0a0d0e"/>
    <rect x="43.86" y="76.6" width="13.43" height="4.9" fill="#c94fc6"/>
    <rect x="57.29" y="76.6" width="13.43" height="4.9" fill="#0a0d0e"/>
    <rect x="70.71" y="76.6" width="13.43" height="4.9" fill="#33d6dc"/>
    <rect x="84.14" y="76.6" width="13.43" height="4.9" fill="#0a0d0e"/>
    <rect x="97.57" y="76.6" width="13.43" height="4.9" fill="#e6e6e3"/>
    <rect x="17.00" y="81.5" width="16.79" height="14.5" fill="#0d2a58"/>
    <rect x="33.79" y="81.5" width="16.79" height="14.5" fill="#f2f2f0"/>
    <rect x="50.57" y="81.5" width="16.79" height="14.5" fill="#3a1a66"/>
    <rect x="67.36" y="81.5" width="16.79" height="14.5" fill="#0a0d0e"/>
    <rect x="84.14" y="81.5" width="4.48" height="14.5" fill="#040506"/>
    <rect x="88.62" y="81.5" width="4.48" height="14.5" fill="#0a0d0e"/>
    <rect x="93.10" y="81.5" width="4.48" height="14.5" fill="#181c1e"/>
    <rect x="97.57" y="81.5" width="13.43" height="14.5" fill="#0a0d0e"/>
    <!-- Trinitron glass: darker at the curved sides and foot, a highlight band along the
         top, and one diagonal reflection sweep -->
    <rect x="17" y="38" width="94" height="58" fill="url(#tubeSides)"/>
    <rect x="17" y="38" width="94" height="58" fill="url(#tubeBottom)"/>
    <rect x="17" y="38" width="94" height="13" fill="url(#glassTop)"/>
    <path d="M17 38 H86 L48 96 H17 Z" fill="url(#glassSweep)"/>
  </g>
  <rect x="17" y="38" width="94" height="58" rx="4.5" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="1"/>

  <!-- control strip: speaker slots, a flip-down panel, two knobs, and the power light -->
  <g class="fine">
    <g fill="#0e1011">
      <rect x="17" y="102.2" width="24" height="1.7" rx="0.85"/>
      <rect x="17" y="105.6" width="24" height="1.7" rx="0.85"/>
      <rect x="17" y="109" width="24" height="1.7" rx="0.85"/>
    </g>
    <g fill="#ffffff" fill-opacity="0.09">
      <rect x="17" y="103.9" width="24" height="0.8" rx="0.4"/>
      <rect x="17" y="107.3" width="24" height="0.8" rx="0.4"/>
      <rect x="17" y="110.7" width="24" height="0.8" rx="0.4"/>
    </g>
    <rect x="48" y="101.5" width="30" height="10" rx="1.8" fill="url(#panel)" stroke="#0e1011" stroke-width="0.9"/>
    <rect x="49" y="102.4" width="28" height="0.9" rx="0.45" fill="#ffffff" fill-opacity="0.12"/>
    <rect x="58" y="106" width="10" height="1.4" rx="0.7" fill="#0e1011"/>
    <circle cx="88.5" cy="106.5" r="3.6" fill="url(#knob)" stroke="#0e1011" stroke-width="0.9"/>
    <circle cx="99.5" cy="106.5" r="3.6" fill="url(#knob)" stroke="#0e1011" stroke-width="0.9"/>
    <path d="M88.5 103.8 V105.6" stroke="#d3d7cf" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M97.7 105.4 L99.2 106.3" stroke="#d3d7cf" stroke-width="0.9" stroke-linecap="round"/>
    <circle cx="110" cy="106.5" r="4.2" fill="url(#ledGlow)"/>
    <circle cx="110" cy="106.5" r="1.7" fill="#8ae234" stroke="#3d7a0b" stroke-width="0.6"/>
    <circle cx="109.5" cy="106" r="0.5" fill="#ffffff" fill-opacity="0.8"/>
  </g>
</svg>
