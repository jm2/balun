[package]
name = "balun"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.94"
description = "A lightweight cross-platform HDHomeRun live TV viewer"
license = "GPL-3.0-or-later"
repository = "https://github.com/jm2/balun"
authors = ["Balun Contributors"]

[dependencies]
blake3 = { version = "1.8", features = ["zeroize"] }
crc32fast = "1.5"
getrandom = "0.4"
if-addrs = { version = "0.15", features = ["link-local"] }
ipnet = "2.12"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
neli = { version = "0.7.4", default-features = false, features = ["async"] }
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[lints.rust]
unsafe_code = "forbid"
